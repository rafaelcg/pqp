org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The only Android platform installed on the machine this was written on is
# API 37, and AGP 9.3.2 predates it. Without this the build fails outright on a
# compile SDK it has no metadata for, which is a warning's worth of risk, not a
# blocker: nothing here calls an API newer than 36.
android.suppressUnsupportedCompileSdk=37
