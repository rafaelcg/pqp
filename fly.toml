# Fly.io configuration for the pqp API + WebSocket server.
#
# Only the API moves here. The SPA stays on Cloudflare Pages; this app serves
# `/api/*`, `/health`, `/status.json` and the `/ws` WebSocket upgrade.
#
# Runbook: docs/deploy-fly.md. `railway.toml` is deliberately left in place so
# the old target stays one `railway up` away — see the Rollback section.
#
# THE ONE THING TO KNOW BEFORE EDITING THIS FILE
# ----------------------------------------------
# This server keeps WebSocket connection state, presence, voice-room membership
# and rate-limit buckets in process memory (server/src/ws/,
# server/src/lib/rate-limit.ts) and shares what has to be shared through
# Postgres (docs/plans/MULTI_INSTANCE_VOICE.md). THIS FILE IS PINNED FOR TWO
# MACHINES (M6 of docs/plans/MULTI_INSTANCE_VOICE.md) — `min_machines_running`
# below is 2, and the flip that makes the live app match it is a deliberate
# manual step, not a side effect of merging: docs/deploy-fly.md "Two machines
# in production" is the exact command order, gated on a green staging matrix
# at N machines (docs/plans/M6_REHEARSAL_2026-09-14.md) and run in a quiet
# window. Until that flip runs, `fly machines list` may still show one. Once
# it runs, every one of these is load-bearing, not aspirational, and all of
# them are now set in THIS FILE's [env] block below rather than only as Fly
# secrets:
#   * CLUSTER_BUS=postgres      chat, presence and voice hints cross instances
#                               over LISTEN/NOTIFY; the boot self-echo proves it
#   * VOICE_REGISTRY=postgres   rooms, seats and transport pins live in Postgres
#   * LIVEKIT_* set (Fly secret, credentialed, not in this file)
#                               a mesh room is relayed by one process and cannot
#                               span two; with two live instances the server
#                               sends new rooms to the SFU, and adopts (never
#                               refuses, since 2026-09-08) a mesh join into a
#                               room pinned on the other process
#   * DATABASE_URL session-mode (LISTEN never delivers through a transaction
#                               pooler; the boot self-echo check says so loudly)
#   * WORKER_MODE=api           batch sweeps (server/src/jobs.ts) run ONCE, on
#                               pqp-worker, not once per API machine. Without
#                               this, N machines run N synchronized copies of
#                               every sweep and flap the DB circuit breaker
#                               (docs/plans/M6_REHEARSAL_2026-09-14.md finding;
#                               pqp-worker already exists and answers /health)
# Unset the bus or the registry with two machines up and you have two chat
# servers behind one hostname. That is a misconfiguration to avoid, not what
# happened on 2026-09-07: that window ran two machines with all four in
# force, chat and LiveKit rooms crossed machines fine, and what bit was the
# guard hanging up peer-to-peer joins (fixed 2026-09-08). See
# `min_machines_running` below.
#
# The invariant CI asserts after every deploy (deploy-api-fly.yml): the number
# of started machines equals `min_machines_running` below (or the repo variable
# PQP_API_MACHINES, which overrides it while a flip is in progress), all in
# gru, AND every started machine answers the deployed commit on ITS OWN
# `/health` (via `fly-force-instance-id`, not just the load-balanced hostname,
# which could pass by luck hitting only one machine). Machine count itself is
# NOT expressible here; it is `fly scale count N --region gru`, a deliberate
# manual step recorded in docs/deploy-fly.md. Deploys pass --ha=false so they
# never add a machine on their own; the rolling strategy below replaces them
# one at a time.
#
# AN AUTO-STOPPED MACHINE DROPS EVERY LIVE WEBSOCKET at once, which client-side
# looks exactly like the "Realtime connection closed" incident this codebase
# already has scar tissue from (CLAUDE.md pitfall #10). Keep auto-stop off.

app = "pqp-api"

# São Paulo. The userbase is Brazilian and this is a latency-sensitive realtime
# app; every WS round-trip and every voice signalling hop pays this distance.
# Keep the database in the same region — a cross-region DB would undo the win.
primary_region = "gru"

# The server installs SIGTERM/SIGINT handlers that drain (server/src/index.ts,
# server/src/lib/drain.ts): `/health` answers 503 at once so the proxy stops
# routing here, the voice lease is withdrawn, then after a 2 s settle every
# socket is closed with code 1001 ("going away") in batches of 50 every
# ~100-150 ms, so the machine that stays up sees a ramp of reconnects rather
# than a stampede; then the HTTP server, bus and pg pool close. The whole
# thing is capped at 25 s in the process, inside this timeout. The clients
# reconnect with backoff on 1001 rather than treating it as an error.
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  # Same multi-stage image Railway builds, unchanged. The runner stage sets
  # NODE_ENV=production, runs as the `node` user and CMDs
  # `node server/dist/index.js` — which is exactly railway.toml's startCommand,
  # so there is no start command to restate here.
  dockerfile = "Dockerfile"

[env]
  # Non-secret configuration lives here (in git, reviewable). Everything with a
  # credential in it goes through `fly secrets set` — see docs/deploy-fly.md.
  # Do NOT also set these as secrets: a secret of the same name shadows [env]
  # and you end up debugging a value that is not in the file you are reading.

  # The app reads `Number(process.env.PORT ?? 3001)`. Fly does not inject PORT,
  # so it would fall back to 3001 anyway — stated explicitly because it MUST
  # agree with `internal_port` below, and a silent disagreement presents as
  # "deploy succeeded, health check never passes".
  PORT = "3001"

  # Exactly one proxy (fly-proxy) sits in front of this process and appends the
  # real client address to X-Forwarded-For. `clientAddress()` counts in from the
  # RIGHT of that chain, so the depth has to be right: too low and the rate
  # limiter keys on an attacker-supplied value, too high and it falls back to
  # the socket address, which behind the proxy is one shared bucket for
  # everybody. One hop = "true". Raise this only if you put another proxy
  # (e.g. Cloudflare proxied DNS) in front of Fly.
  TRUST_PROXY = "true"

  # pg pool ceiling PER MACHINE. With min_machines_running = 2 below, the
  # app's total connection footprint is roughly 2 x (PG_POOL_MAX + 2) — the
  # +2 is CLUSTER_BUS's dedicated LISTEN session plus a second, separate
  # LISTEN session the outgoing-webhook poller holds per machine, both
  # outside the pool (confirmed live in pg_stat_activity by
  # docs/plans/M6_REHEARSAL_2026-09-14.md, a detail the M1/M2
  # MULTI_INSTANCE_VOICE plan's "one LISTEN session per machine" framing
  # undercounts).
  #
  # THE FORMULA (docs/deploy-fly.md "Two machines in production" walks this
  # with live numbers): total budget, minus the worker's own pool
  # (fly.worker.toml PG_POOL_MAX=4) and the nightly backup's one transient
  # connection, minus a small reserve for admin/platform sessions, divided by
  # the machine count, minus 2 for this machine's own LISTEN sessions.
  #
  # Production Postgres today is Vultr Managed PostgreSQL (2 dedicated vCPU /
  # 4 GB, single node — docs/plans/ALWAYS_ON.md §5), which replaced the Fly
  # Managed Postgres cluster docs/DB_RUNBOOK.md §3's connection-budget table
  # was written against. That table stops at a 2 GB row, so the number below
  # extends that table's own 1 GB->~30 / 2 GB->~50 progression by the same
  # +20-per-GB step to a ~90-backend ceiling at 4 GB. TREAT 90 AS AN ESTIMATE
  # TO CONFIRM against `SHOW max_connections` on the live cluster before the
  # flip runs, not as a measured fact — this PR does not touch production and
  # cannot run that query. (90 - worker 4 - backup 1 - admin/platform 5) / 2
  # machines - 2 LISTEN = 38. The single-machine live value today is
  # PG_POOL_MAX=70 against that same ~90 estimate, which is the sanity check
  # for the estimate: one machine already uses most of the budget alone.
  PG_POOL_MAX = "38"

  # Batch sweeps (server/src/jobs.ts: attachment/quarantine sweeps, audit /
  # report / timeout prunes, retention, interrupted-account deletion, the
  # outgoing-webhook outbox, the Community Home media sweep) run on
  # pqp-worker ONLY. Required at two machines, not merely preferred: unset,
  # each API machine runs its own copy of every sweep on its own local
  # setInterval, and two machines that boot within seconds of each other (a
  # `fly scale count` or a rolling deploy) fire them in near-synchronized
  # bursts that flap the DB circuit breaker (server/src/db.ts) even though
  # steady-state Postgres load is fine — reproduced at three machines in
  # docs/plans/M6_REHEARSAL_2026-09-14.md, not theoretical. pqp-worker already
  # exists and answers /health (docs/deploy-fly.md §7f), so this is safe to
  # set here rather than as a separate `fly secrets set` step.
  WORKER_MODE = "api"

  # Cross-instance chat/presence fan-out over Postgres LISTEN/NOTIFY. See the
  # file banner above and docs/plans/MULTI_INSTANCE_VOICE.md (M1).
  CLUSTER_BUS = "postgres"

  # Voice rooms, seats and transport pins live in Postgres so a join can land
  # on either machine and find the room's state. See the file banner above
  # and docs/plans/MULTI_INSTANCE_VOICE.md (M2).
  VOICE_REGISTRY = "postgres"

[http_service]
  internal_port = 3001
  force_https = true

  # OFF. Not "stop", not "suspend". A stopped machine terminates every live
  # WebSocket simultaneously; a suspended one is worse, because the socket dies
  # while the in-process presence/voice-room Maps are restored from a snapshot
  # that no longer matches any connected client.
  auto_stop_machines = "off"

  # OFF for symmetry and to keep machine lifecycle entirely manual. Note this
  # can only ever *restart a machine you already have*. Fly's proxy never
  # creates machines, so this is not the extra-machine risk; that risk lives in
  # `fly scale count` / `fly deploy --ha`. If you would rather the proxy be able
  # to wake a machine that somehow ended up stopped, flipping this to true is
  # safe. It is false here so that "a machine is down" surfaces as an outage
  # you investigate rather than a latency spike you never notice.
  auto_start_machines = false

  # TWO machines, gru, rolling deploys. On 2026-09-07 production first ran
  # two machines from 13:20Z to 15:59Z with chat, presence and six LiveKit
  # rooms crossing them for up to 80 minutes, one cross-machine resume
  # adopted, zero app-level errors and zero user reports; the one thing that
  # did not survive it (the mesh guard refusing a peer-to-peer join when the
  # room's pin lived on the other process, four times, once ending a
  # two-person call) was fixed 2026-09-08 — the pin is adopted and mesh
  # signaling crosses the bus instead. `docs/plans/M6_REHEARSAL_2026-09-14.md`
  # then rehearsed the full production shape on staging at three machines
  # with `LIVEKIT_*` set, real LiveKit media, a rolling deploy under load and
  # a 3->2->3 scale test, and closed the WORKER_MODE finding folded into this
  # file's [env] block above. The flip that makes a live `pqp-api` match this
  # file (this PR changes no running infrastructure by itself) is
  # `docs/deploy-fly.md` "Two machines in production", gated on that staging
  # matrix passing green and run in a quiet window.
  #
  # With auto-stop off this is not a lever Fly pulls; it is the number CI
  # asserts after a deploy (or PQP_API_MACHINES while a flip is in progress)
  # and the number `fly scale count` has to match, in gru. Merging this file
  # is one step of the flip; `fly scale count 2` is the other, and CI's
  # per-machine `/health` check (deploy-api-fly.yml) is what confirms both
  # sides agree.
  min_machines_running = 2

  processes = ["app"]

  [http_service.concurrency]
    # `connections`, NOT `requests`. Every signed-in client holds one WebSocket
    # open for its whole session, so connection count, not request rate, is
    # what this app is actually bounded by.
    #
    # THE DEFAULTS ARE A TRAP FOR A WEBSOCKET APP: soft_limit 20 / hard_limit 25.
    # hard_limit is the point at which fly-proxy STOPS SENDING TRAFFIC to the
    # machine, and with a single machine there is nowhere else to send it, so
    # the next client gets a 503 on an app that may be completely idle. In the
    # proxy log that is "could not find a good candidate ... at load
    # balancing", which reads exactly like a dead API and is not; the 600 that
    # used to be here was crossed during the 2026-09-07 load tests, and a
    # 500-person watch party on one machine crosses it too. Fly's docs say no
    # hard_limit is enforced when the field is unset; it is set here as a
    # memory backstop, not as capacity.
    #
    # Sized from measurements (server/scripts/README.md, "What compression
    # was worth"): with compression on, peak RSS was 365 MB at 400 sockets
    # and 609 MB at 800, under 1 MB a socket, so 2000 sockets is under 2 GB —
    # this now sizes to THIS machine's 2048mb ([[vm]] above, downsized from
    # 4gb with the move to two machines), with less headroom per machine than
    # before for the heap and a reconnect storm, when a closing socket and
    # its replacement both count for a few seconds. A 500-person watch party
    # plus an ordinary evening (a few hundred sockets) is about 1000, the
    # soft limit — now split across two machines rather than carried by one,
    # which is the point of the flip. Outbound bandwidth gives out first
    # anyway (measured floor 350 in one room, projected 650 to 700 after the
    # presence deltas), so the proxy is never the first to say no.
    type = "connections"
    soft_limit = 1000
    hard_limit = 2000

  # Health check. `/health` is the only unauthenticated route (every /api/*
  # route resolves a Bearer token before routing, so anything else answers 401)
  # and, as of A3.1 in docs/plans/ALWAYS_ON.md, is PROCESS LIVENESS ONLY: no
  # `SELECT 1`, no database call of any kind. It used to run one, and on
  # 2026-09-12 that coupling was the incident — Postgres collapsed, the pool
  # saturated, this check failed with it, and Fly stopped routing to the only
  # machine, taking WebSockets, the HLS playlist proxy and every cached read
  # down too, none of which needed Postgres at that instant. A 200 here now
  # means only "process up and not draining"; database health belongs to
  # `/ready` (services/ready.ts), which is deliberately NOT what this check
  # points at, same as before.
  #
  # This means `/health` no longer proves a broken release can reach
  # Postgres at all, so it no longer alone gates a deploy against that class
  # of failure — deploy-api-fly.yml's separate "Verify the release is ready
  # (Postgres reachable)" step additionally curls `/ready` before declaring
  # the release done, so routing health and deploy safety are two different
  # checks instead of one overloaded one.
  #
  # It also answers 503 from the moment the process gets SIGTERM
  # (server/src/lib/drain.ts), which is how a rolling deploy hands the
  # sockets over: the proxy stops routing to the draining machine within one
  # interval, and the reconnects land on the other one. 10 s rather than the
  # old 30 s for that reason; with two machines an unhealthy one has a
  # sibling to fail over to. Note `/up` (the external monitor) deliberately
  # does NOT go red on a drain: a deploy is not an incident.
  [[http_service.checks]]
    method = "GET"
    path = "/health"
    protocol = "http"
    interval = "10s"
    timeout = "5s"
    # initDb() runs the whole of server/src/schema.sql before listen(), and the
    # first boot against an empty database is the slow one. Do not shrink this
    # to the point where a cold start looks like a failure.
    grace_period = "30s"

# On WebSocket idle timeouts, since this is the classic way a WS deploy dies
# quietly: there is no knob to set. Fly removed proxy-level TCP idle-timeout
# enforcement in 2023 (it now relies on kernel SO_KEEPALIVE / TCP_USER_TIMEOUT),
# and `http_options` has no idle_timeout field to configure. So nothing here
# fights the app's own 30s ping/pong heartbeat in server/src/index.ts, and that
# heartbeat remains the thing that reaps half-open sockets. If connections start
# dying on a fixed interval, suspect something you put IN FRONT of Fly
# (Cloudflare proxied DNS has its own 100s idle timeout), not this file.

[[vm]]
  # Signalling and chat only. Media is peer-to-peer in mesh mode and goes to
  # LiveKit in SFU mode, so this process never touches audio. Even so, the
  # shared-cpu-1x / 1GB size saturated on 2026-09-05 at ~370 open sockets and
  # a 50-person SFU room: root requests took >10s, the health check flapped and
  # Clerk tokens expired while queued. Scaled live to performance-2x/4gb (one
  # machine) and the API answered in 0.3s again.
  #
  # DOWNSIZED to performance-1x / 2048mb with the move to TWO machines
  # (Rafael's brief, 2026-09-14: "two performance-1x 2 GB machines... scalable
  # from/to 2...n"). This is a real size change, not assumed safe by the M6
  # rehearsal, which ran staging at a different size class entirely
  # (shared-cpu-1x/1gb through shared-cpu-2x/1gb boxes) — it rehearsed the
  # cluster mechanics (bus, registry, drain, resume, rolling deploy), not this
  # exact machine size under production's own peak. Production's own measured
  # peak on the current performance-2x/4gb machine is modest (~156 MB RSS,
  # ~1 core, 185 sockets), which is why two smaller machines are expected to
  # carry it with headroom to spare rather than being a downsize taken on
  # faith — but watch RSS and CPU on both machines for the first real day at
  # this size (docs/deploy-fly.md "what to watch for a day") and revert to
  # performance-2x/4gb (one line here) if either machine runs hot alone.
  size = "performance-1x"
  memory = "2048mb"

[deploy]
  # rolling + max_unavailable = 1 (an integer: one machine at a time). With
  # two machines the other stays up throughout, and the one being replaced
  # drains its sockets over to it (kill_timeout above). With one machine it
  # means: replace that one machine in place, a few seconds of downtime, and
  # the clients reconnect (client/src/lib/realtime.ts backs off and
  # re-resolves a Clerk token per attempt).
  #
  # DO NOT switch this to "bluegreen" or "canary". Both double the machine
  # count during the deploy, and the drain story is written for in-place
  # rolling; the cluster invariants in the banner are per machine, not per
  # release.
  strategy = "rolling"
  max_unavailable = 1

  # No release_command. Schema application is initDb() at boot
  # (server/src/db.ts reads server/src/schema.sql), which is idempotent and runs
  # before listen(); a release_command would be a second machine talking to the
  # same database for no benefit.
