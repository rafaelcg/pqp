# XcodeGen spec — the .xcodeproj is generated, never hand-edited or committed
# with merge conflicts in it. Regenerate with:
#
#     cd ios && xcodegen generate
#
name: pqp
options:
  bundleIdPrefix: gg.pqp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # The audience is Brazilian; pt-BR ships alongside English.
  knownRegions: [en, pt-BR]
  developmentLanguage: en

packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: "1.3.6"
  # Google's WebRTC, prebuilt as an xcframework. The server's default voice
  # backend is a peer mesh, so interoperating with the web clients means
  # speaking real WebRTC rather than an SFU SDK.
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: "150.0.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Swift 6 strict concurrency from the start. Retrofitting it onto a
    # finished app is a rewrite; adopting it now costs a few @MainActor
    # annotations.
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Simulator/CI builds stay unsigned; Release overrides below sign for
    # device + TestFlight with automatic signing against the real team.
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  pqp:
    type: application
    platform: iOS
    sources:
      - path: pqp/Sources
      # XcodeGen has no `resources:` key — a path listed here is classified by
      # type, and .xcassets/.xcstrings become bundle resources. The old
      # `resources:` block below was silently ignored, which shipped an app
      # with no icon and none of its localizations.
      - path: pqp/Resources
      # The bridge's wire format and socket, shared verbatim with the broadcast
      # extension below. Compiled into both targets rather than packaged as a
      # framework: it is two files with no dependencies, and a framework would
      # be one more thing to embed and sign for no benefit.
      - path: pqp/ScreenShare
    # ---------------------------------------------------------- entitlements
    # Generated by XcodeGen from these properties, so the entitlements live in
    # exactly one reviewable place instead of in a plist nobody reads. The file
    # it writes (pqp/pqp.entitlements) is a build artifact of `xcodegen
    # generate`, like the .xcodeproj itself.
    #
    # associated-domains — universal links. An invite link on pqp.gg opens this
    #   app instead of Safari. This says which domain to trust; the other half is
    #   client/public/.well-known/apple-app-site-association, which says which
    #   paths on it belong to this app (only /app/invite/*). `applinks:` alone —
    #   no `webcredentials:` (no passwords to share) and no
    #   `activitycontinuation:` (nothing to hand off).
    #
    #   Universal links are verified against Apple's CDN copy of that file, so
    #   they cannot work before it is deployed to pqp.gg. During development use
    #   the custom scheme instead (registered in Info.plist):
    #       xcrun simctl openurl booted "pqp://invite/ABC123"
    #
    # aps-environment — remote notifications. NOT the same switch as the
    #   server's APNS_ENVIRONMENT: this one is baked into the build, and Xcode
    #   rewrites it to `production` when it exports a TestFlight or App Store
    #   archive. So a build run from Xcode gets sandbox device tokens (a local
    #   server pushing to it needs APNS_ENVIRONMENT=sandbox), while TestFlight
    #   onwards is production, which is the server's default.
    #
    # Both capabilities must also be enabled on the App ID in the developer
    # portal, or Release signing fails with "provisioning profile doesn't
    # include the … entitlement".
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gg.pqp.app
        # Set to a pk_… value to switch the app onto real Clerk auth.
        # Empty means the dev-bypass token, which only a local server accepts.
        CLERK_PUBLISHABLE_KEY: ""
        # Debug device builds only: the LAN address of the Mac running
        # `pnpm dev`. Empty means localhost, which is what the simulator wants.
        PQP_API_HOST: ""
        PRODUCT_NAME: pqp
        INFOPLIST_FILE: pqp/Info.plist
        # Makes the compiler write one .stringsdata per file listing every
        # localised literal it saw. That is the only authoritative answer to
        # "which strings are copy", and it is what the postCompileScript below
        # checks the string catalogue against.
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        # The app is a dark, high-contrast surface by design; letting iOS
        # light-mode it produces an unreadable half-theme.
        UIUserInterfaceStyle: Dark
      configs:
        Release:
          DEVELOPMENT_TEAM: WXBFUF9WMA
          CODE_SIGNING_REQUIRED: "YES"
          # Manual, with API-minted profiles: xcodebuild's automatic signing
          # rejects the App Store Connect API key for capability registration
          # ("Authentication failed"), so the profiles are created via the API
          # directly and named here. Recreate with the asc scripts if they
          # expire — the App Group, push and associated-domains capabilities
          # live on the App IDs, not in this file.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "pqp appstore"
          # TestFlight builds talk to production, so they need the live key —
          # it is publishable by design, same one the web bundle ships.
          CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsucHFwLmdnJA
    postCompileScripts:
      # English copy that never reached Localizable.xcstrings renders in
      # English for a pt-BR reader, with no error anywhere. See the script's
      # header for why this cannot be a test.
      - script: |
          "$SRCROOT/Scripts/check-localization.py" \
            "$SRCROOT/pqp/Resources/Localizable.xcstrings" \
            "$OBJECT_FILE_DIR_normal"
        name: Check localisation coverage
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/pqp/Resources/Localizable.xcstrings
          - $(SRCROOT)/Scripts/check-localization.py
    dependencies:
      # ClerkKit is the client; ClerkKitUI supplies the prebuilt auth flow.
      # The auth UI is used as-shipped rather than rebuilt: it covers email
      # codes, OAuth and MFA, none of which can be exercised here without a
      # real inbox, and a hand-rolled version would be unverifiable.
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
      - package: WebRTC
        product: WebRTC
      # Embedded into the app bundle. Without this the broadcast picker finds no
      # extension and its sheet is empty.
      - target: pqpBroadcast
        embed: true
    entitlements:
      path: pqp/pqp.entitlements
      properties:
        # The app and the extension are separate processes; the group container
        # is the only filesystem they share, and the frame socket lives in it.
        com.apple.security.application-groups:
          - group.gg.pqp.app
        # Universal links: an invite link on pqp.gg opens this app instead of
        # Safari. The other half is client/public/.well-known/
        # apple-app-site-association, which scopes it to /app/invite/*.
        com.apple.developer.associated-domains:
          - applinks:pqp.gg
        # Remote notifications. NOT the server's APNS_ENVIRONMENT: this one is
        # baked into the build, and Xcode rewrites it to `production` when it
        # exports a TestFlight/App Store archive — so Xcode-run builds get
        # sandbox device tokens, TestFlight onwards production.
        aps-environment: development

  # ReplayKit broadcast upload extension — system-wide screen sharing, which is
  # the only kind iOS offers. See pqp/Broadcast/SampleHandler.swift.
  pqpBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: pqp/Broadcast
      - path: pqp/ScreenShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gg.pqp.app.broadcast
        PRODUCT_NAME: pqpBroadcast
        INFOPLIST_FILE: pqp/Broadcast/Info.plist
        # An extension is delivered inside its host app, never on its own.
        SKIP_INSTALL: YES
      configs:
        Release:
          DEVELOPMENT_TEAM: WXBFUF9WMA
          CODE_SIGNING_REQUIRED: "YES"
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "pqp broadcast appstore"
    entitlements:
      path: pqp/Broadcast/pqpBroadcast.entitlements
      properties:
        com.apple.security.application-groups:
          - group.gg.pqp.app

  pqpTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: pqp/Tests
    dependencies:
      - target: pqp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gg.pqp.app.tests
        GENERATE_INFOPLIST_FILE: YES

  pqpUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: pqp/UITests
    dependencies:
      - target: pqp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gg.pqp.app.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  pqp:
    build:
      targets:
        pqp: all
        pqpBroadcast: all
        pqpTests: [test]
        pqpUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - pqpTests
        - pqpUITests
