# XcodeGen spec — the .xcodeproj is generated, never hand-edited or committed
# with merge conflicts in it. Regenerate with:
#
#     cd ios && xcodegen generate
#
name: pqp
options:
  bundleIdPrefix: gg.pqp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Swift 6 strict concurrency from the start. Retrofitting it onto a
    # finished app is a rewrite; adopting it now costs a few @MainActor
    # annotations.
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  pqp:
    type: application
    platform: iOS
    sources:
      - path: pqp/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gg.pqp.app
        PRODUCT_NAME: pqp
        INFOPLIST_FILE: pqp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        # The app is a dark, high-contrast surface by design; letting iOS
        # light-mode it produces an unreadable half-theme.
        UIUserInterfaceStyle: Dark
    resources:
      - path: pqp/Resources

  pqpTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: pqp/Tests
    dependencies:
      - target: pqp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gg.pqp.app.tests
        GENERATE_INFOPLIST_FILE: YES

  pqpUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: pqp/UITests
    dependencies:
      - target: pqp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gg.pqp.app.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  pqp:
    build:
      targets:
        pqp: all
        pqpTests: [test]
        pqpUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - pqpTests
        - pqpUITests
