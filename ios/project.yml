# XcodeGen spec — the .xcodeproj is generated, never hand-edited or committed
# with merge conflicts in it. Regenerate with:
#
#     cd ios && xcodegen generate
#
name: pqp
options:
  bundleIdPrefix: gg.pqp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # The audience is Brazilian; pt-BR ships alongside English.
  knownRegions: [en, pt-BR]
  developmentLanguage: en

packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: "1.3.6"
  # Google's WebRTC, prebuilt as an xcframework. The server's default voice
  # backend is a peer mesh, so interoperating with the web clients means
  # speaking real WebRTC rather than an SFU SDK.
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: "150.0.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Swift 6 strict concurrency from the start. Retrofitting it onto a
    # finished app is a rewrite; adopting it now costs a few @MainActor
    # annotations.
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Simulator/CI builds stay unsigned; Release overrides below sign for
    # device + TestFlight with automatic signing against the real team.
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  pqp:
    type: application
    platform: iOS
    sources:
      - path: pqp/Sources
      # XcodeGen has no `resources:` key — a path listed here is classified by
      # type, and .xcassets/.xcstrings become bundle resources. The old
      # `resources:` block below was silently ignored, which shipped an app
      # with no icon and none of its localizations.
      - path: pqp/Resources
      # The bridge's wire format and socket, shared verbatim with the broadcast
      # extension below. Compiled into both targets rather than packaged as a
      # framework: it is two files with no dependencies, and a framework would
      # be one more thing to embed and sign for no benefit.
      - path: pqp/ScreenShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gg.pqp.app
        # Set to a pk_… value to switch the app onto real Clerk auth.
        # Empty means the dev-bypass token, which only a local server accepts.
        CLERK_PUBLISHABLE_KEY: ""
        # Debug device builds only: the LAN address of the Mac running
        # `pnpm dev`. Empty means localhost, which is what the simulator wants.
        PQP_API_HOST: ""
        PRODUCT_NAME: pqp
        INFOPLIST_FILE: pqp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        # The app is a dark, high-contrast surface by design; letting iOS
        # light-mode it produces an unreadable half-theme.
        UIUserInterfaceStyle: Dark
      configs:
        Release:
          DEVELOPMENT_TEAM: WXBFUF9WMA
          CODE_SIGNING_REQUIRED: "YES"
          CODE_SIGN_STYLE: Automatic
          # TestFlight builds talk to production, so they need the live key —
          # it is publishable by design, same one the web bundle ships.
          CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsucHFwLmdnJA
    dependencies:
      # ClerkKit is the client; ClerkKitUI supplies the prebuilt auth flow.
      # The auth UI is used as-shipped rather than rebuilt: it covers email
      # codes, OAuth and MFA, none of which can be exercised here without a
      # real inbox, and a hand-rolled version would be unverifiable.
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
      - package: WebRTC
        product: WebRTC
      # Embedded into the app bundle. Without this the broadcast picker finds no
      # extension and its sheet is empty.
      - target: pqpBroadcast
        embed: true
    entitlements:
      path: pqp/pqp.entitlements
      properties:
        # The app and the extension are separate processes; the group container
        # is the only filesystem they share, and the frame socket lives in it.
        com.apple.security.application-groups:
          - group.gg.pqp.app

  # ReplayKit broadcast upload extension — system-wide screen sharing, which is
  # the only kind iOS offers. See pqp/Broadcast/SampleHandler.swift.
  pqpBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: pqp/Broadcast
      - path: pqp/ScreenShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gg.pqp.app.broadcast
        PRODUCT_NAME: pqpBroadcast
        INFOPLIST_FILE: pqp/Broadcast/Info.plist
        # An extension is delivered inside its host app, never on its own.
        SKIP_INSTALL: YES
      configs:
        Release:
          DEVELOPMENT_TEAM: WXBFUF9WMA
          CODE_SIGNING_REQUIRED: "YES"
          CODE_SIGN_STYLE: Automatic
    entitlements:
      path: pqp/Broadcast/pqpBroadcast.entitlements
      properties:
        com.apple.security.application-groups:
          - group.gg.pqp.app

  pqpTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: pqp/Tests
    dependencies:
      - target: pqp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gg.pqp.app.tests
        GENERATE_INFOPLIST_FILE: YES

  pqpUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: pqp/UITests
    dependencies:
      - target: pqp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gg.pqp.app.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  pqp:
    build:
      targets:
        pqp: all
        pqpBroadcast: all
        pqpTests: [test]
        pqpUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - pqpTests
        - pqpUITests
