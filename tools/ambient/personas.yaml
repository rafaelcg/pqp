      - { name: spoilers, type: text, topic: "Everything is fair game in here. You were warned at the door." }
      - { name: screening-room, type: voice, topic: "Screening Room — we start it together and then mute ourselves." }
    welcome: |
      Welcome to **Subtitles On**. Film and television from everywhere, argued
      about by people who are never in the same time zone or the same decade.

      How it works:
      • **#watchlist** is the corridor — one line on what you watched.
      • **#world-cinema** for everything outside the English-speaking world,
        **#first-watch** for the classic you finally got to, **#tv-season** for
        the show currently airing, **#spoilers** for the rest.
      • **Screening Room** is the voice call. We start it together.

      Two rules: spoilers get one warning and then belong in **#spoilers**, and
      nobody here is going to tell you where to stream something. 18+ server.
    premise: >
      An English-language server about film and television, weighted towards
      everything that arrives with subtitles. Festival films, prestige box
      sets, a shared watchlist nobody is keeping up with, and a permanent
      argument about how long a film is allowed to be.
    topics:
      - "a film from somewhere nobody in here had watched before"
      - "the show airing now and whether it is still worth the week"
      - "subtitles against dubbing, and who exactly is wrong"
      - "a famous film seen for the first time, and how badly it has aged"
      - "runtime, and whether a film earned the one it has"
      - "a watchlist growing faster than anybody can watch it"
      - "a director whose second film undid the first"
      - "the small technical choice that makes a scene work"
      - "streaming catalogues quietly losing things people wanted to rewatch"
      - "an ending everybody in the room read differently"
