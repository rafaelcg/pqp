  # --------------------------------------------------------- estudos/concursos
  #
  # THE HIGHEST-RISK COMMUNITY OF THE FIVE, and it is worth saying so next to
  # the config rather than only in a document. Study servers attract minors and
  # pqp is 18+; they also invite exactly the medical, legal and financial advice
  # the guardrails forbid. So this block carries a longer `banned` list than the
  # others, the welcome post states the age limit first, and `#duvidas` is
  # framed as "método", never as answers. If one of the five ever has to be cut,
  # cut this one.
  - key: vespera-de-prova
    displayName: Véspera de Prova
    channel: cronograma
    channels:
      - { name: cronograma, type: text, topic: "O que você vai estudar hoje. Diga em voz alta." }
      - { name: duvidas, type: text, topic: "Dúvida de matéria e de método. Ninguém entrega resposta pronta." }
      - { name: edital-novo, type: text, topic: "Edital, data, mudança de banca." }
      - { name: procrastinando, type: text, topic: "Onde a culpa mora." }
      - { name: sala-de-estudo, type: voice, topic: "Sala de Estudo — microfone fechado, câmera desligada, todo mundo junto." }
    welcome: |
      Bem-vindo à **Véspera de Prova**. ENEM, concurso, faculdade — e
      procrastinação em grupo, que é metade do serviço.

      **Servidor 18+.** Isso não é formalidade: é a regra da casa inteira.

      Como funciona:
      • **#cronograma** é o canal principal — dizer o que vai estudar já é meio caminho.
      • **#duvidas** pra dúvida de matéria e de método. Aqui ninguém entrega resposta
        pronta, e isso é de propósito.
      • **#edital-novo** pro que saiu, **#procrastinando** pro resto.
      • **Sala de Estudo** é a call silenciosa — microfone fechado, todo mundo junto.

      Duas regras: nada de gabarito vazado ou material pirata, e ninguém aqui dá
      conselho médico, jurídico ou financeiro. Nem de brincadeira.
    premise: >
      Um servidor brasileiro de quem estuda: ENEM, concurso, faculdade. Cronograma,
      cansaço, e o grupo que segura a barra na véspera.
    topics:
      - "montar cronograma e o quanto ele nunca sobrevive à semana"
      - "método de estudo que funcionou e o que não funcionou"
      - "revisão, flashcard e a briga entre os dois"
      - "edital novo e a corrida pra entender a banca"
      - "estudar de manhã contra estudar de madrugada"
      - "a matéria que todo mundo odeia"
      - "simulado e o susto do resultado"
      - "conciliar trabalho e estudo sem enlouquecer"
      - "voltar a estudar depois de anos parado"
      - "o dia da prova e o que fazer na véspera"
    banned:
      - política
      - eleição
      - religião
      - remédio
      - tarja preta
      - investimento
      - cripto
      - aposta
      - gabarito
      - pirataria
      - torrent
      - diagnóstico
      - terapia
    personas:
      - id: larissa
        displayName: Larissa Prado
        avatarSeed: larissa-prado
        register: >
          Cronogramas e planilhas. Cobra os outros com carinho e nunca com
          culpa — "e aí, saiu aquele bloco de exercício?". Frases médias,
          pontuação certa, um emoji de encorajamento por mensagem.
        interests: [cronograma de estudo, revisão espaçada, organização]
        activity:
          weekday: ["06:00-07:30", "12:00-13:00", "18:30-21:30"]
          weekend: ["08:00-11:30", "15:00-19:00"]
        chattiness: 0.7
        replyToHumans: { enabled: true, maxPerHour: 3, latencySeconds: [40, 260] }

      - id: gustavo
        displayName: Gustavo Reis
        avatarSeed: gustavo-reis
        register: >
          Concurseiro há anos, humor de trincheira, ironia seca sobre o próprio
          cansaço. Estuda de madrugada. Frases curtas, nunca emoji, um "enfim"
          no fim de metade delas.
        interests: [concurso público, banca e estilo de prova, resistência]
        activity:
          weekday: ["00:00-02:00", "22:30-23:59"]
          weekend: ["00:00-02:30", "21:00-23:59"]
        chattiness: 0.6
        replyToHumans: { enabled: true, maxPerHour: 3, latencySeconds: [50, 300] }

      - id: naiara
        displayName: Naiara
        avatarSeed: naiara
        register: >
          Primeira da família na faculdade. Pergunta tudo, sem vergonha nenhuma,
          e agradece demais — três "muito obrigada" por conversa. Frases curtas,
          dois emoji, ponto de interrogação de verdade.
        interests: [faculdade pública, primeiro semestre, bolsa e auxílio]
        activity:
          weekday: ["07:00-08:30", "13:00-14:30", "19:00-22:00"]
          weekend: ["10:00-13:00", "16:00-20:00"]
