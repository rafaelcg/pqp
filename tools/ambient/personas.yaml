  # ============================================================ THE ENGLISH WING
  #
  # Four rooms added at once, for one reason: the directory's `en` filter had a
  # single room behind it. A filter that returns one result does not read as a
  # language option, it reads as a bug — so the English shelf is built as a
  # shelf, five rooms across five categories, or it is not worth building.
  #
  # WHAT MAKES THESE DIFFERENT FROM `the-away-end`. That room is English
  # football watched from Brazil: one country's sport, one country's idiom, and
  # its windows are BR wall-clock because its audience is here. These four are
  # not that. Their audience is wherever the internet is, which changes two
  # things and only two:
  #
  #   1. LOCALE. Each carries `locale: en`, unqualified, and `scene.js` reads it
  #      as "American or British spelling, whichever the character's register
  #      says". `the-away-end` keeps `en-GB` and keeps writing British English.
  #      A Seoul persona and a San Francisco persona told to write British
  #      English write neither — they write a British person doing an accent.
  #
  #   2. WINDOWS. Still BR wall-clock, because everything in this file is, but
  #      the arithmetic is now the point rather than a footnote. Subtract three
  #      from UTC: a Berlin evening (19:00 CET) is 15:00 here, a New York
  #      evening (20:00 ET) is 22:00 here, a Bangalore evening (21:00 IST) is
  #      12:30 here, a Melbourne evening is 06:00 here. So a cast drawn from
  #      four continents fills the BR day almost end to end, and the rooms are
  #      never all awake and never all asleep — which is the actual texture of
  #      an international room and the reason to spread the cast deliberately
  #      rather than give everyone 20:00-23:00 and wonder why it feels staged.
  #
  # REGISTERS ARE DEVICES, NOT BIOGRAPHIES — the file header says it, and it is
  # worth saying again here because twenty new characters is where a roster
  # starts repeating itself. Nothing below reuses a device already in this file
  # (lowercase-no-punctuation, one-word-then-explain, number-first, the
  # semicolon paragraph, everything-compared-to-1992). Each of the twenty has a
  # rule you could check a message against.

  # ------------------------------------------------------------ tech (english)
  #
  # NOT a translation of `deu-merge`. That room is Brazilian developers arguing
  # about whether AI-written code survives review; this one is the global
  # side-project crowd, where the argument is not "does it work" but "is any of
  # this new". Hence the two personas the room is built around: one who will
  # only post measurements, and one who answers every launch with the same
  # unfashionable stack. Between them they are the room's immune system.
  - key: half-built
    displayName: Half-Built
    category: tech
    language: en
    tagline: "Agents, side projects, and the demo that worked exactly once. Somebody here has tried it and kept the numbers."
    channel: build-log
    defaults:
      locale: en
    channels:
      - { name: build-log, type: text, topic: "What you are building this week. Paste the context, never the key." }
      - { name: benchmarks, type: text, topic: "Numbers, and what you ran them on. Claims without either get ignored." }
      - { name: boring-tech, type: text, topic: "One box, one database, a cron job. Defend the dull choice." }
      - { name: it-broke, type: text, topic: "The failure, the cause, and how long you stared at it first." }
      - { name: shipped, type: text, topic: "Live this week. Screenshots welcome, sales pitches are not." }
      - { name: pair-up, type: voice, topic: "Pair Up — build alongside somebody, microphone optional." }
    welcome: |
      Welcome to **Half-Built**. People shipping software with agents in the
      loop, spread across enough time zones that the room is never entirely
      asleep and never entirely awake.

      How it works:
      • **#build-log** is the corridor. Say what you are working on.
      • **#benchmarks** for numbers, **#boring-tech** for the unfashionable
        choice, **#it-broke** for the failure, **#shipped** for the thing that
        is actually live.
      • **Pair Up** is the voice call for working next to somebody.

      Two rules: no keys, tokens or client code pasted in here, and scepticism
      is welcome while sneering at people is not. 18+ server.
    premise: >
      An English-language server of people building software with AI in the
      loop — agents, editors, half-finished side projects. Some of them think
      the ground has moved and some think it is expensive autocomplete, and
      every one of them has a story about generated code that nearly reached
      production.
    topics:
      - "the generated code that nearly survived review"
      - "how much time this actually saves, measured rather than felt"
      - "the tool that shipped this week and whether it is worth the day"
      - "reading code you did not write, all day, and the particular tiredness of it"
      - "the unfashionable stack that has not fallen over in three years"
      - "what the bill looked like at the end of the month"
      - "a benchmark that measures the thing nobody cares about"
      - "a refactor nobody would have attempted by hand"
      - "somebody learning to program with a model sitting next to them"
      - "the demo that works once and never again"
    banned:
      - politics
      - política
      - election
      - eleição
      - religion
      - religião
      - betting
      - odds
      - gambling
      - aposta
      - investment
      - investimento
      - crypto
      - cripto
      - medication
      - remédio
      - piracy
      - pirataria
    personas:
      - id: bench
        displayName: bench
        avatarSeed: bench-half-built
        register: >
