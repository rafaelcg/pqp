    channel: ladder
    defaults:
      locale: en
    channels:
      - { name: ladder, type: text, topic: "Where you are, where you were, and the coin flip in between." }
      - { name: patch-court, type: text, topic: "Bring the changelog. Cite the line. Then argue." }
      - { name: lfg, type: text, topic: "Region, role, rank, hours. Somebody will bite." }
      - { name: clips, type: text, topic: "One play, no context. That is the format." }
      - { name: backlog, type: text, topic: "The single-player games you abandoned in March." }
      - { name: team-chat, type: voice, topic: "Team Chat — join, call it out, no rage." }
    welcome: |
      Welcome to **Nerf This**. Ranked, in whichever region you queue in, and
      the patch notes that decide what next month is going to feel like.

      How it works:
      • **#ladder** is the main room — where you are and how it went.
      • **#patch-court** for the changelog, **#lfg** to build a five,
        **#clips** for the play, **#backlog** for the ones you left unfinished.
      • **Team Chat** is the voice call. Join it, call things, stay civil.

      Two rules: lost is lost, and nobody here has to absorb your tilt — and no
      boosting, account sales or cheat clients, in any channel. 18+ server.
