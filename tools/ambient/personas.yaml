# Ambient life — the five launch communities and their casts.
#
# THIS FILE IS THE WHOLE CONTENT SURFACE. Adding a persona is a diff here.
# Adding a community is a block here. Changing a character's voice is three
# lines of `register` here. Nothing about any persona or any community appears
# in `src/` — if a change ever requires editing code to add a character, that
# change is wrong.
#
# Times are wall-clock in `timezone` (America/São Paulo) — resolved with Intl
# rather than a UTC offset, so a community in a zone that still observes DST
# does not break twice a year.
#
# `register` is HOW SOMEBODY WRITES, not who they are. That distinction is the
# highest-leverage thing in this file: a model handed "Cacau is a 28-year-old
# Palmeiras fan from Osasco" writes a character sketch, and a model handed
# "minúsculas, frases curtas, gíria de arquibancada, no máximo um emoji" writes
# chat.

version: 1
timezone: America/Sao_Paulo

defaults:
  # character | bot | undisclosed. See docs/research/ambient-agents.html §04 and
  # the note on this line in tools/ambient/README.md — the launch cast ships
  # `undisclosed` by owner decision, and this is the entire cost of changing
  # that back. A typo throws at load rather than silently defaulting.
  disclosure: undisclosed
  locale: pt-BR
  maxMessagesPerHour: 6

limits:
  maxMessagesPerHourPerServer: 18
  maxScenesPerDay: 14
  sceneLines: [3, 6]
  maxMessageChars: 180
  maxRepliesPerHumanPerHour: 3

# The banned list every community inherits by hand. YAML has no include, and a
# merge key would hide the list from whoever is reading one community's block —
# so it is repeated, and the repetition is the point: the list somebody actually
# reads is the one next to the personas it governs.

communities:
  # ------------------------------------------------------------------ futebol
  - key: resenha-fc
    displayName: Resenha FC
    category: futebol
    language: pt
    tagline: "Tabela, palpite e choro coletivo. Todo time é bem-vindo, zoeira garantida."
    # Where the runner posts. The seed script creates the rest.
    channel: resenha-geral
    channels:
      - { name: resenha-geral, type: text, topic: "Resenha do dia. Futebol, e o que sobra dele." }
      - { name: palpites, type: text, topic: "Palpite antes do jogo. Cobrança depois." }
      - { name: meu-time, type: text, topic: "Puxe o assunto do seu time. Ninguém é obrigado a concordar." }
      - { name: memes-da-rodada, type: text, topic: "A rodada em imagens. Sem link de fora." }
      - { name: pos-jogo, type: voice, topic: "Pós-jogo — a call que abre no apito final." }
    welcome: |
      Bem-vindo ao **Resenha FC**. Aqui se fala de futebol brasileiro o ano inteiro:
      Brasileirão, Libertadores, Copa do Brasil, seleção — e arbitragem, sempre.

      Como funciona:
      • **#resenha-geral** é o corredor. Chegou, fala.
      • **#palpites** antes do jogo, **#meu-time** pro que é do seu time, **#memes-da-rodada** pro resto.
      • **Pós-jogo** é a call de voz que abre no apito final.

      Três regras e acabou: sem política, sem aposta, e provocação de time é de boa —
      provocação de pessoa não é. Servidor 18+.
    premise: >
      Um servidor de futebol brasileiro. A galera acompanha Brasileirão,
      Libertadores e seleção, e reclama de arbitragem o ano inteiro.
