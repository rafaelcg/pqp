  # ------------------------------------------------- premier league (english)
  #
  # THE ONE ENGLISH-LANGUAGE ROOM, and the reason `language:` exists at all.
  # Everything downstream reads it: the directory's filter, the listing column,
  # and — the part that matters here — the generation prompt, which is written
  # in English end to end for this community. A cast whose register notes say
  # "dry Northern understatement" and whose prompt asks for português is a cast
  # that writes neither.
  #
  # Windows are BR wall-clock like every other community in this file, because
  # the audience is in Brazil watching English football: a 12:30 kick-off in
  # England lands at 09:30 here and the 15:00 block lands mid-morning. That is
  # why the weekend peak is late morning rather than evening — it is the same
  # Saturday, read from São Paulo.
  - key: the-away-end
    displayName: The Away End
    category: futebol
    language: en
    tagline: "Premier League at brunch hour. Ten kick-offs, one group chat, opinions nobody asked for."
    channel: matchday
    defaults:
      locale: en-GB
    channels:
      - { name: matchday, type: text, topic: "Team news, kick-off, and the chat that never stops." }
      - { name: transfer-talk, type: text, topic: "Rumours, medicals, and the window that ruins everyone." }
      - { name: tactics-board, type: text, topic: "Shapes, pressing traps, and why your full-back is exposed." }
      - { name: bad-takes, type: text, topic: "Say it here. We will hold it against you in May." }
      - { name: sunday-league, type: text, topic: "Your own knees, your own Saturday morning." }
      - { name: full-time-call, type: voice, topic: "Full Time — the call that opens on the final whistle." }
    welcome: |
      Welcome to **The Away End**. English football, watched from wherever you
      are — which for most of us means kick-off lands somewhere around brunch.

      How it works:
      • **#matchday** is the main room. Turn up, say something.
      • **#transfer-talk** for rumours, **#tactics-board** for the shapes,
        **#bad-takes** for the ones you will regret, **#sunday-league** for your own
        Saturday morning.
      • **Full Time** is the voice call that opens on the final whistle.

      Three rules: no politics, no betting talk of any kind, and clubs are fair
      game — people are not. 18+ server.
    premise: >
      An English-language server about English football, mostly read from
      Brazil. Premier League first, but the cup weekends, the European nights
      and everybody's own Sunday league knees all get a look in.
    topics:
      - "the weekend's fixtures and who is quietly in trouble"
      - "team news, a suspension, and the shape it forces"
      - "a refereeing decision nobody has stopped talking about"
      - "a young player who looked ready and the temptation to rush him"
      - "the table, the run-in, and the maths of staying up"
      - "a manager under pressure and what you would actually do instead"
      - "the transfer window and the rumour that will not die"
      - "kit design, ticket prices, and the cost of following a club"
      - "the women's game and how little of it gets shown"
      - "playing Sunday league at an age where it hurts on Monday"
    banned:
