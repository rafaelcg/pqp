  #
  # `sala-de-espera` is a Brazilian queue: same server, same ping, same three
  # friends. This one is the opposite condition — five regions, five clocks, and
  # a patch note that everybody has read and nobody agrees about. The room's
  # engine is `#patch-court`, and the cast is built so an argument there has a
  # prosecution (Dax, who quotes the line), a grader (Okoro), a witness who
  # writes better English than any native speaker in the room (Hye-jin), and two
  # people who are only here because the queue is long.
  - key: nerf-this
    displayName: Nerf This
