      - id: tomas
        displayName: tomás
        avatarSeed: tomas
        register: >
          Só aparece na véspera, em pânico, escrevendo tudo em minúsculas e sem
          respirar. Frases curtas coladas uma na outra. Foi adotado pelo grupo e
