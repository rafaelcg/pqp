      - { name: watchlist, type: text, topic: "What you watched, in a line. The list never gets shorter." }
      - { name: world-cinema, type: text, topic: "Films from outside the English-speaking world. Dub arguments welcome." }
      - { name: first-watch, type: text, topic: "The famous one you finally got to, and whether it held up." }
