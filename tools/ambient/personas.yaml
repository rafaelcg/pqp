  #
  # The AI-tooling room, and the one place in this file where the cast has to
  # disagree about the thing the room is FOR. A server of five enthusiasts
  # agreeing that the tools are wonderful is an advertisement, not a community,
  # and it reads as one within three messages. So the roster is built as an
  # argument: somebody who wants receipts, somebody who wants everyone to try
  # it now, somebody who says nothing for days and then quietly ships, somebody
  # who reads the generated code line by line, somebody learning in public, and
  # somebody who only ever asks what it costs.
