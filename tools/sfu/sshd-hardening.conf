# pqp SFU box: SSH hardening. Managed by tools/sfu/install.sh in the pqp repo.
#
# Ubuntu ships /etc/ssh/sshd_config.d/50-cloud-init.conf containing
# "PasswordAuthentication yes", which is why the box answered password prompts
# even though the main sshd_config says no. sshd takes the FIRST value it sees
# for a keyword and Include expands the glob alphabetically, so this file wins
# by sorting ahead of the cloud-init one. Do not rename it above 50-.
#
# Verify the outcome, never the file:
#   sshd -T | grep -E "^(passwordauthentication|pubkeyauthentication)"
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
