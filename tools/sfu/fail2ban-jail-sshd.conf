# pqp SFU box: SSH brute-force jail. Managed by tools/sfu/install.sh.
#
# Read the sibling note in /etc/ssh/sshd_config.d/01-pqp-hardening.conf first:
# password auth is off, so none of this is what keeps the box safe. It is here
# to stop the 5k-a-day knocking from filling the journal and burning CPU on
# key exchanges that can never succeed.

[DEFAULT]
# Loopback only. Key-based logins never match the sshd filter in "normal" mode,
# so an admin with a working key cannot ban themselves; there is nothing else
# that needs whitelisting. Add an operator IP here only if you have a reason.
ignoreip = 127.0.0.1/8 ::1

[sshd]
enabled = true

# Read the journal, not /var/log/auth.log. rsyslog happens to be installed on
# this box today, but a rebuilt Ubuntu 24.04 may not have it, and a jail whose
# log file never appears starts clean and watches nothing forever.
backend = systemd

# THE line that matters. fail2ban ships
#   journalmatch = _SYSTEMD_UNIT=sshd.service + _COMM=sshd
# which is correct on RHEL and wrong on Ubuntu, where the unit is ssh.service.
# With the shipped value the jail starts, reports "Currently failed: 0" forever
# and bans nobody. Verify with: fail2ban-client status sshd
journalmatch = _SYSTEMD_UNIT=ssh.service + _COMM=sshd

# "normal" and not "aggressive": aggressive counts ordinary connection closes,
# which would eventually ban a flaky admin connection.
mode = normal

maxretry = 4
findtime = 30m
bantime  = 1w

# Repeat offenders climb: 1w, 2w, 4w, capped at 5w.
bantime.increment = true
bantime.factor    = 2
bantime.maxtime   = 5w
