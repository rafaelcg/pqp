# Overlay for a STAGING LiveKit box. Do not add this to production
# (sfu-pqp): production yaml is "no Redis, no webhooks" on purpose.
#
# Usage on a throwaway São Paulo VM, after tools/sfu/install.sh:
#   docker compose -f /opt/livekit/docker-compose.yaml \
#                  -f /opt/sfu/hls/docker-compose.yaml up -d
#
# LiveKit must also grow a redis: block pointing at 127.0.0.1:6379.
# Track Composite egress does not need Chrome.
#
# egress.yaml MUST be mode 0644 on the host:
#   chmod 0644 /opt/sfu/hls/egress.yaml
# The egress image runs as a non-root user and reads the file through the
# read-only bind mount below. A 0600 file is "permission denied" inside the
# container and the service exits without a useful line in journald. This
# is what runs on staging; do not add `user: "0:0"` to work around it.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    command: ["redis-server", "--save", "", "--appendonly", "no", "--bind", "127.0.0.1"]
    logging: { driver: journald }
  egress:
    image: livekit/egress:v1.14.1
    restart: unless-stopped
    network_mode: host
    cap_add: ["SYS_ADMIN"]
    cpus: 2.5
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
    logging: { driver: journald }
