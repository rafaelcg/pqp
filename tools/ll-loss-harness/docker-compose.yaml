# tools/ll-loss-harness: a fully local, offline LL-HLS + packet-loss repro
# rig. Everything here binds to 127.0.0.1 only and talks to nothing beyond
# this Docker Desktop instance -- see README.md "What this cannot reach".
#
# Three services:
#   livekit  - a single-node LiveKit server, ephemeral keys generated by
#              scripts/gen-keys.sh into .data/harness.env and baked into
#              .data/livekit.yaml right before `up` (never committed, never
#              a production key).
#   remuxd   - the REAL tools/pqp-remux/cmd/pqp-remuxd control-plane
#              supervisor, unmodified, built from this repo's own source.
#   publisher - rampub (this directory's own harness-only fake presenter),
#              with NET_ADMIN so its entrypoint can apply netem loss to its
#              own egress interface before it publishes -- see
#              publisher/entrypoint.sh for exactly which interface and
#              direction, and why that models a presenter's uplink.
#
# run.sh is what actually drives this file (env_file, `up`, waiting for
# readiness, tearing down); `docker compose up` by hand also works once
# scripts/gen-keys.sh and scripts/gen-ramp.sh have been run once.
services:
  livekit:
    image: livekit/livekit-server:v1.13.6
    command: --config /etc/livekit.yaml --bind 0.0.0.0
    volumes:
      - ./.data/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # Loopback-only publish: nothing here is reachable from outside this
      # Mac, let alone the internet.
      - "127.0.0.1:7880:7880"
    networks: [harness]

  remuxd:
    build:
      context: ../../.
      dockerfile: tools/ll-loss-harness/remuxd/Dockerfile
    env_file: ./.data/harness.env
    environment:
      # CONTROL_LISTEN must accept connections from the Docker port-publish
      # path (which arrives on the container's eth0, not its loopback), so
      # it cannot be 127.0.0.1 the way the real box's default is --
      # LoadGlobalConfig's own validation is what then requires
      # MEDIA_ORIGIN_KEY, which harness.env already sets.
      CONTROL_LISTEN: ":8090"
      LIVEKIT_URL: "${LIVEKIT_URL:-ws://livekit:7880}"
    depends_on: [livekit]
    ports:
      - "127.0.0.1:8090:8090"
    networks: [harness]

  publisher:
    build:
      context: ./publisher
    env_file: ./.data/harness.env
    environment:
      LIVEKIT_URL: "${LIVEKIT_URL:-ws://livekit:7880}"
      ROOM: "${ROOM:-ll-loss-harness}"
      FILE: "/media/ramp.h264"
      LOSS_PCT: "${LOSS_PCT:-0}"
    volumes:
      - ./.data:/media:ro
    cap_add:
      - NET_ADMIN
    depends_on: [livekit]
    networks: [harness]
    # Run on demand from run.sh (`docker compose run publisher`), not
    # brought up by a bare `docker compose up`: it should only start once
    # remuxd already has a session waiting to subscribe, and it exits on
    # its own once ramp.h264 finishes streaming.
    profiles: ["publish"]

networks:
  harness:
    driver: bridge
