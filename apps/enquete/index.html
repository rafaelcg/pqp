<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enquete</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main class="enq" id="enq" data-view="connecting">
      <header class="enq-head">
        <h1 class="enq-title" id="title">Enquete</h1>
        <p class="enq-status" id="status" role="status"></p>
      </header>

      <section class="enq-card" id="v-waiting" aria-labelledby="waiting" hidden>
        <p class="enq-waiting" id="waiting"></p>
        <p class="enq-muted" id="waiting-hint"></p>
      </section>

      <!-- not a <form>: the frame is sandboxed without allow-forms, and a sandboxed form never fires its submit event -->
      <section class="enq-card" id="v-setup" aria-labelledby="setup-title" hidden>
        <h2 class="enq-heading" id="setup-title"></h2>

        <div class="enq-field">
          <label class="enq-label" for="question" id="question-label"></label>
          <textarea class="enq-input enq-question" id="question" rows="2" maxlength="300" autocomplete="off"></textarea>
        </div>

        <fieldset class="enq-field enq-fieldset">
          <legend class="enq-label" id="options-label"></legend>
          <ol class="enq-rows" id="option-rows"></ol>
          <button class="enq-button enq-button-quiet" id="add-option" type="button"></button>
        </fieldset>

        <fieldset class="enq-field enq-fieldset">
          <legend class="enq-label" id="mode-label"></legend>
          <div class="enq-modes">
            <label class="enq-choice"><input type="radio" name="mode" value="single" id="mode-single" checked /><span id="mode-single-text"></span></label>
            <label class="enq-choice"><input type="radio" name="mode" value="multi" id="mode-multi" /><span id="mode-multi-text"></span></label>
          </div>
        </fieldset>

        <p class="enq-error" id="setup-error" role="alert" hidden></p>
        <button class="enq-button" id="start" type="button"></button>
      </section>

      <section class="enq-card" id="v-poll" aria-labelledby="poll-question" hidden>
        <h2 class="enq-question-text" id="poll-question" tabindex="-1"></h2>
        <p class="enq-muted" id="poll-hint"></p>

        <fieldset class="enq-fieldset enq-group" id="poll-group" aria-labelledby="poll-question">
          <ul class="enq-options" id="options"></ul>
        </fieldset>

        <div class="enq-line">
          <p class="enq-voters" id="voters"></p>
          <button class="enq-button enq-button-quiet" id="clear-vote" type="button" hidden></button>
        </div>

        <p class="enq-closed" id="closed" hidden>
          <span class="enq-closed-tag" id="closed-tag"></span>
          <span class="enq-closed-winner" id="winner"></span>
        </p>

        <div class="enq-host" id="host" hidden>
          <button class="enq-button" id="close" type="button"></button>
          <div class="enq-confirm" id="confirm" role="group" aria-labelledby="confirm-text" hidden>
            <p class="enq-confirm-text" id="confirm-text"></p>
            <div class="enq-confirm-actions">
              <button class="enq-button enq-button-quiet" id="confirm-no" type="button"></button>
              <button class="enq-button" id="confirm-yes" type="button"></button>
            </div>
          </div>
          <button class="enq-button" id="end" type="button" hidden></button>
        </div>
        <p class="enq-muted" id="host-note" hidden></p>
      </section>

      <p class="enq-notice" id="notice" role="alert" hidden></p>
      <p class="enq-ended" id="ended" role="status" hidden></p>
      <p class="enq-sr" id="live" aria-live="polite"></p>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
