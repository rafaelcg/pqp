<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Source of truth for every desktop icon. Same mark as the PWA / favicon set
    (client/public/icons, drawn by scripts/generate-icons.py): a speech bubble
    with three dots, a typing indicator, for a product whose tagline is
    "built for the group that won't shut up".

    Geometry is the vector equivalent of that rasteriser at mark_scale 0.62 and
    corner 0.22, so the desktop icon and the web icon are the same drawing.

    Colours are the brand tokens from client/src/index.css, converted from oklch:
      color-surface-0  oklch(0.16 0.012 250)  is  #090E12
      color-accent     oklch(0.88 0.19 125)   is  #BBEC4C

    Regenerate the binaries with: node electron/scripts/generate-icons.js
  -->
  <rect width="1024" height="1024" rx="225.28" ry="225.28" fill="#090E12"/>
  <g fill="#BBEC4C">
    <!-- Tail first, so the bubble body hides the join instead of showing a seam. -->
    <path d="M346.93 737.12 H473.91 L365.98 887.68 Z"/>
    <rect x="194.56" y="243.92" width="634.88" height="495.20" rx="148.56" ry="148.56"/>
  </g>
  <g fill="#090E12">
    <circle cx="362.80" cy="476.66" r="52.00"/>
    <circle cx="512.00" cy="476.66" r="52.00"/>
    <circle cx="661.20" cy="476.66" r="52.00"/>
  </g>
</svg>
