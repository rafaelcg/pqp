    <!-- Matches the manifest's background/theme so the standalone splash and
         the status bar do not flash a different colour on launch. -->
    <meta name="theme-color" content="#090e12" />

    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icons/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- iOS ignores the web app manifest for these, so they are stated twice on
         purpose. `black-translucent` is what lets the app draw under the status
         bar, which only works because the viewport is already viewport-fit=cover
         and the shell honours safe-area insets. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="pqp" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      Vite injects the app bundle at the end of <body>, so this runs first and
      the theme is on the element before the first paint rather than one frame
      after it. Keep it dependency-free. If a CSP is ever added it needs a hash
      for this script.
    -->
    <script>
      try {
        const stored = localStorage.getItem("pqp-theme");
        const preference =
          stored === "light" || stored === "dark" ? stored : "system";
        let theme =
          preference === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;
        // Marketing routes are compositions over a hero photograph and stay
        // dark. `/@handle` and the claim landing belong to the same set: they
        // are `DarkRoutes` in the router, and without them here a light-mode
        // visitor gets one white frame before the layout effect pins it, on
        // the two pages most likely to be somebody's first impression.
        const path = location.pathname.replace(/\/+$/, "") || "/";
        if (
          ["/", "/privacy", "/terms", "/cookies", "/garanta", "/claim"].includes(
            path,
          ) ||
          path.startsWith("/@")
        ) {
          theme = "dark";
        }
        document.documentElement.dataset.theme = theme;
        // Keep in lockstep with `normalizeAppearance` in client/src/lib/appearance.ts
        // (and the Zod preprocess). This script cannot import that module.
        const storedAppearance = localStorage.getItem("pqp-appearance");
        const appearance =
          storedAppearance === "guild" || storedAppearance === "accord"
            ? "harmony"
            : storedAppearance === "harmony" ||
                storedAppearance === "hearth" ||
                storedAppearance === "night"
              ? storedAppearance
              : "signal";
        document.documentElement.dataset.appearance = appearance;
        if (appearance === "night") {
          document.documentElement.dataset.theme = "dark";
        }
        const storedHue = localStorage.getItem("pqp-accent-hue");
        if (storedHue && storedHue !== "default") {
          const hue = Number(storedHue);
          if (Number.isInteger(hue) && hue >= 0 && hue <= 360) {
            document.documentElement.dataset.accent = "custom";
            document.documentElement.style.setProperty("--accent-hue", String(hue));
          }
        }
        const storedContrast = localStorage.getItem("pqp-contrast");
        const contrastPreference =
          storedContrast === "more" || storedContrast === "default"
            ? storedContrast
            : "system";
        const contrast =
          contrastPreference === "system"
            ? window.matchMedia("(prefers-contrast: more)").matches
              ? "more"
              : "default"
            : contrastPreference;
        if (contrast === "more") {
          document.documentElement.dataset.contrast = "more";
        }
      } catch {
        // Storage or matchMedia blocked, the stylesheet defaults to dark.
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
