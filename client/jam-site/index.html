<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>pqp jam</title>
    <meta name="description" content="Songs anybody can listen to, and play along with." />
    <!-- The edge (client/functions/_middleware.ts) writes the real head for a
         song and for the home. This is what a request that never met it sees:
         kept out of search, since it could be a page that is not on yet. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="pqp jam" />
    <meta name="theme-color" content="#090e12" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- The faces are in the stylesheet (src/fonts.css, via the entry), but the
         browser only asks for a file once a rendered word needs it, and here
         that is the end of HTML, script, catalogue, render: the headline sat in
         the Arial-metric fallback until then. Same three files and the same
         reason as the app's index.html. `crossorigin` is required for a font
         preload, or the file is fetched twice. -->
    <link rel="preload" href="/src/assets/fonts/gabarito-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/dela-gothic-one-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Before the bundle, so the theme is on the element for the first paint.
         Dark first: no stored choice is dark. Keep it dependency-free. -->
    <script>
      try {
        const stored = localStorage.getItem("pqp-theme");
        let theme = "dark";
        if (stored === "light" || stored === "dark") {
          theme = stored;
        } else if (stored === "system") {
          theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <!-- A skeleton for the seconds before React: the bundle, the catalogue and the
         locale file all come before the first render, and on a slow link that is
         a blank page. It is plain markup and a few rules INSIDE the root, so React
         replaces it on its first commit and nothing has to remove it. No text (the
         language is not known yet), its colours are the site's own role tokens
         (the stylesheet is render-blocking, so the tokens and the stored theme are
         both on the element by now, light included), its blocks have the header's
         and the page column's measurements so the swap does not move anything, and
         the shimmer is a transform on a pseudo-element, off for reduced motion. -->
    <div id="root">
      <div class="jam-boot" aria-hidden="true">
        <style>
          .jam-boot { min-height: 100dvh; background: var(--color-surface-0, #090e12); }
          .jam-boot-bar { height: 64px; box-sizing: border-box; border-bottom: 1px solid var(--color-border, rgba(255, 255, 255, 0.08)); }
          .jam-boot-page { box-sizing: border-box; width: 100%; max-width: 76rem; margin: 0 auto; padding: 32px 16px; }
          @media (min-width: 640px) { .jam-boot-page { padding-left: 32px; padding-right: 32px; } }
          .jam-boot-block { position: relative; overflow: hidden; background: var(--color-surface-2, #1b242c); border-radius: 12px; }
          .jam-boot-head { height: 44px; width: min(28rem, 70%); }
          .jam-boot-cards { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 32px; }
          @media (min-width: 768px) { .jam-boot-cards { grid-template-columns: repeat(3, 1fr); } }
          .jam-boot-card { height: 224px; border-radius: 16px; background: var(--color-surface-1, #121920); }
          @media (prefers-reduced-motion: no-preference) {
            .jam-boot-block::after {
              content: ""; position: absolute; inset: 0;
              background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent);
              transform: translateX(-100%); animation: jam-boot-shimmer 1.4s ease-in-out infinite;
            }
            @keyframes jam-boot-shimmer { to { transform: translateX(100%); } }
          }
        </style>
        <div class="jam-boot-bar"></div>
        <div class="jam-boot-page">
          <div class="jam-boot-block jam-boot-head"></div>
          <div class="jam-boot-cards">
            <div class="jam-boot-block jam-boot-card"></div>
            <div class="jam-boot-block jam-boot-card"></div>
            <div class="jam-boot-block jam-boot-card"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/jam-site/entry.tsx"></script>
  </body>
</html>
