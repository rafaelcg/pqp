<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>pqp stand-in game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <!--
      A stand-in for a game running uncapped, for share-diagnostic.html. It
      draws a moving full-window shader on every display refresh (120 frames a
      second on a ProMotion Mac, 360 on a 360 Hz monitor) and lets you raise
      the cost of each frame until the graphics card is busy all the time,
      which is what an uncapped game does. "Cap at 60" draws the same frames
      at most 60 times a second. Nothing leaves the page.

      URL parameters: load=light|heavy|extreme|<n>, cap=60.
    -->
    <style>
      :root {
        --bg: #000;
        --text: #e6edf3;
        --panel: rgba(13, 17, 23, 0.85);
        --line: #30363d;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        right: 12px;
        max-width: 560px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
      }
      #hud b {
        font-variant-numeric: tabular-nums;
      }
      button {
        font: inherit;
        color: var(--text);
        background: #21262d;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px 10px;
        margin: 4px 4px 0 0;
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        background: #1f6feb;
        border-color: #388bfd;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">
      <div><b id="fps">-</b> frames per second drawn. Share this window from the diagnostic.</div>
      <div>
        Load:
        <button data-load="light">light</button>
        <button data-load="heavy">heavy</button>
        <button data-load="extreme">extreme</button>
        <button id="cap">Cap at 60</button>
      </div>
      <div style="color: #8b949e; margin-top: 4px">
        Heavy should keep the frame rate at your display's refresh while the graphics card is fully busy.
        If the number drops well below your refresh rate, pick a lighter load.
      </div>
    </div>
    <script>
      "use strict";
      const params = new URLSearchParams(location.search);
      const LOADS = { light: 60, heavy: 600, extreme: 1000 };
      // Clamped: the count is compiled into a loop run for every pixel of
      // every frame, and a link must not be able to hang the graphics card.
      const clampLoad = (n) => Math.min(2000, Math.max(1, Math.round(n)));
      let iters = clampLoad(LOADS[params.get("load")] || Number(params.get("load")) || LOADS.heavy);
      let cap = params.get("cap") === "60" ? 60 : 0;
      const canvas = document.getElementById("c");
      const gl = canvas.getContext("webgl2", { antialias: false, powerPreference: "high-performance" });
      const fit = () => {
        canvas.width = Math.round(innerWidth * devicePixelRatio);
        canvas.height = Math.round(innerHeight * devicePixelRatio);
      };
      fit();
      addEventListener("resize", fit);
      let program = null;
      let uT = null;
      let uR = null;
      function build() {
        const vs = "#version 300 es\nin vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }";
        // The loop count is baked in so the driver cannot shorten it: the cost
        // of one frame is exactly what the load button says.
        const fs = `#version 300 es
          precision highp float; uniform float t; uniform vec2 r; out vec4 o;
          void main() {
            vec2 z = gl_FragCoord.xy / r * 2. - 1.;
            vec3 col = vec3(0.);
            for (int i = 0; i < ${iters}; i++) {
              z = vec2(z.x * z.x - z.y * z.y, 2. * z.x * z.y) * 0.5
                + vec2(sin(t * 0.7 + float(i) * 0.01), cos(t * 0.3)) * 0.4;
              col += 0.002 * vec3(abs(z), fract(z.x * z.y));
            }
            o = vec4(col + 0.15 * vec3(sin(t * 3.), sin(t * 2.1), sin(t * 1.3)), 1.);
          }`;
        const compile = (type, src) => {
          const s = gl.createShader(type);
          gl.shaderSource(s, src);
          gl.compileShader(s);
          return s;
        };
        const p = gl.createProgram();
        gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
        gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
        gl.linkProgram(p);
        gl.useProgram(p);
        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
        const loc = gl.getAttribLocation(p, "p");
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
        uT = gl.getUniformLocation(p, "t");
        uR = gl.getUniformLocation(p, "r");
        if (program) gl.deleteProgram(program);
        program = p;
        showButtons();
      }
      function showButtons() {
        document.querySelectorAll("[data-load]").forEach((b) => b.setAttribute("aria-pressed", String(LOADS[b.dataset.load] === iters)));
        document.getElementById("cap").setAttribute("aria-pressed", String(cap === 60));
      }
      build();
      document.querySelectorAll("[data-load]").forEach((b) =>
        b.addEventListener("click", () => {
          iters = LOADS[b.dataset.load];
          build();
        }),
      );
      document.getElementById("cap").addEventListener("click", () => {
        cap = cap ? 0 : 60;
        showButtons();
      });
      let frames = 0;
      let last = performance.now();
      let nextAt = 0;
      window.__gameFps = 0;
      function frame(now) {
        requestAnimationFrame(frame);
        if (cap) {
          if (now < nextAt) return;
          nextAt = Math.max(nextAt + 1000 / cap, now - 1000 / cap);
        }
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.uniform1f(uT, now / 1000);
        gl.uniform2f(uR, canvas.width, canvas.height);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        frames += 1;
        if (now - last >= 1000) {
          window.__gameFps = (frames * 1000) / (now - last);
          document.getElementById("fps").textContent = window.__gameFps.toFixed(0);
          frames = 0;
          last = now;
        }
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
