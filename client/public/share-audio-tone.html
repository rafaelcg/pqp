<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>pqp share-audio 880 Hz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font: 16px/1.4 system-ui, sans-serif;
        background: #111;
        color: #eee;
        margin: 2rem;
      }
    </style>
  </head>
  <body>
    <p>880 Hz game-stand-in. Leave this window playing. Speakers stay up.</p>
    <p>This document is not the one capturing, so restrictOwnAudio must not strip it.</p>
    <script>
      const context = new AudioContext();
      const oscillator = context.createOscillator();
      const gain = context.createGain();
      oscillator.type = "sine";
      oscillator.frequency.value = 880;
      gain.gain.value = 0.2;
      oscillator.connect(gain);
      gain.connect(context.destination);
      const start = () => {
        context.resume();
        try {
          oscillator.start();
        } catch {
          // already started
        }
      };
      document.addEventListener("click", start, { once: true });
      start();
    </script>
  </body>
</html>
