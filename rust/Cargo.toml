[workspace]
resolver = "2"
members = ["crates/pqp-core", "crates/pqp-deflate"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/rafaelcg/pqp"

[workspace.dependencies]
url = "2"
base64 = "0.22"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = "thin"
