packages:
  - server
  - client
  - electron
  - packages/shared
  - packages/app-sdk
  - tools/watch-party-load
  - tools/apps-build
  - docs-apps
  - apps/*

# Supply-chain policy for RESOLVING dependencies (`pnpm add`, `pnpm update`, a
# lockfile regeneration). `pnpm install --frozen-lockfile`, which CI and the
# Dockerfile use, never resolves, so neither setting changes what they install.
#
# minimumReleaseAge is in MINUTES: a version published less than 3 days ago is
# not picked. Every 2025-2026 npm worm was caught and yanked within days, and
# the lockfile history shows versions locked the day they were published. An
# urgent security fix that is younger than that goes in
# `minimumReleaseAgeExclude` (name or name@version), on purpose and with a
# comment, and comes out again once it is old enough.
minimumReleaseAge: 4320
# Refuse a version whose trust evidence (npm provenance or a trusted publisher)
# is weaker than an earlier release of the same package, the shape of a
# hijacked publish token.
trustPolicy: no-downgrade
# ...but only for versions published in the last 30 days (minutes). The check
# compares publish dates, so an old backport on an older major line (`semver`
# 6.3.1 came after 7.x gained provenance) reads as a downgrade forever, and
# with no cutoff every lockfile-changing command (Dependabot included) failed
# with ERR_PNPM_TRUST_DOWNGRADE on packages nobody just published. A hijacked
# publish is caught inside days, which is the window that needs the check.
trustPolicyIgnoreAfter: 43200
# A dependency that gains an install script the list below does not name fails
# the install instead of being skipped with a warning nobody reads. As of
# pnpm 10.33.0 nothing is ignored (`pnpm ignored-builds` prints "None"), so
# this changes no current install; it only makes a new script a decision.
strictDepBuilds: true

allowBuilds:
  "@clerk/shared": true
  esbuild: true
  electron: true
  electron-winstaller: true
  # `uiohook-napi` ships prebuilt N-API binaries for every target platform
  # (win/mac/linux). Its "install" script only verifies the right one is
  # present, never compiles. See electron/README.md "Global push-to-talk".
  uiohook-napi: true

# `@emulatorjs/emulatorjs` lists `@emulatorjs/cores` as an optional dependency,
# which pulls EVERY core, and several of those (Snes9x, Genesis Plus GX,
# PicoDrive) are licensed non-commercial-only, which AGPL-3.0 cannot carry. The
# emulator room names its two cores one by one in client/package.json instead.
# See docs/EMULATOR_ROOM.md.
ignoredOptionalDependencies:
  - "@emulatorjs/cores"

# The same package also declares its own build tooling (a minifier, a static
# file server, a socket.io server for its demo netplay) as hard dependencies.
# The client only copies its prebuilt `data/` folder, so none of that is
# installed; "-" removes the dependency edge.
overrides:
  "@emulatorjs/emulatorjs>@node-minify/clean-css": "-"
  "@emulatorjs/emulatorjs>@node-minify/core": "-"
  "@emulatorjs/emulatorjs>@node-minify/terser": "-"
  "@emulatorjs/emulatorjs>http-server": "-"
  "@emulatorjs/emulatorjs>node-7z": "-"
  "@emulatorjs/emulatorjs>node-fetch": "-"
  "@emulatorjs/emulatorjs>nipplejs": "-"
  "@emulatorjs/emulatorjs>socket.io": "-"
