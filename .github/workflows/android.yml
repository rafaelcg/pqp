name: Android

# Its own workflow file, deliberately, and not a job bolted onto `ci.yml`.
#
# `ci.yml` guards the API and the web client, and `deploy-api-fly.yml` ships the
# API from `main` minutes after a merge. An Android build that cannot find an
# SDK platform must never be the reason an API fix does not deploy, so the two
# pipelines share nothing: no runner, no toolchain, no required check.
#
# The reason it exists at all: before this file, "the Android build works" was a
# property of one laptop. The iOS side already paid for that lesson once, when an
# agent honestly reported BUILD SUCCEEDED against a generated Xcode project that
# `main` could not produce.

# The path lists are duplicated rather than shared through a YAML anchor:
# GitHub's workflow parser does not expand aliases, so an anchor here silently
# becomes an empty filter and the workflow runs on everything.
#
# The non-Android entries are not padding. The Android client hand-copies
# every wire fact out of them, and the tests in
# `android/app/src/test/kotlin/gg/pqp/app/protocol` read them off disk to check
# the copies still match. A protocol change on the server has to be able to fail
# this build, or those tests are decoration.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "packages/shared/src/**"
      - "server/src/ws/**"
      - "server/src/api/index.ts"
      - "client/src/lib/peer-connection-manager.ts"
      - "client/src/lib/realtime.ts"
      - "client/src/lib/emoji-shortcodes.ts"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "packages/shared/src/**"
      - "server/src/ws/**"
      - "server/src/api/index.ts"
      - "client/src/lib/peer-connection-manager.ts"
      - "client/src/lib/realtime.ts"
      - "client/src/lib/emoji-shortcodes.ts"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 37 because sixteen dependencies floor there. See the comment on
  # `compileSdk` in android/app/build.gradle.kts. Named here so the platform the
  # build compiles against is a fact of the repo rather than of whoever's
  # machine happens to have it installed.
  COMPILE_SDK: "37"
  BUILD_TOOLS: "36.0.0"
  # The certificate that must sign every sideload APK, so that a tester's
  # existing install can be updated in place. Public by construction: it is what
  # the installed APK already exposes and what
  # `client/public/.well-known/assetlinks.json` publishes on purpose. Pinned
  # here so a key that quietly changes is a red build rather than a fortnight of
  # "the update button does nothing". Rotating it deliberately means editing
  # this line, that file, and the four ANDROID_SIDELOAD_* secrets, and telling
  # testers to reinstall. See docs/ANDROID.md, "The sideload signing key".
  SIDELOAD_CERT_SHA256: "EE:28:41:C9:89:FD:20:0D:27:8B:32:D4:30:A3:63:A1:E7:D2:2E:20:0F:86:19:E2:82:D6:F0:6B:DA:46:BB:F3"

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # The whole repo, not a sparse android/ checkout: the protocol tests
        # read packages/shared, server/src/ws and client/src/lib off disk.

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # The laptop this was written on runs Android Studio's bundled JBR 25.
          # The bytecode target is pinned at 17 in build.gradle.kts on both, so
          # the JDK the compiler itself runs on is not part of the artifact.
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: false
          # Only `main` writes the cache, so a PR cannot poison it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Installs cmdline-tools and accepts the licences. The platform is
          # installed in the next step, where a miss can be reported clearly.
          packages: ""

      - name: Install the compile SDK
        shell: bash
        run: |
          set -uo pipefail
          # Android ships minor platform releases now, so the package id is
          # `platforms;android-37.0` on a current SDK and plain
          # `platforms;android-37` on an older one. The versioned spelling is
          # tried first because it is the one that exists today; the plain one
          # is the fallback rather than the other way round, so the ordinary
          # path leaves no "Failed to find package" line in the log to
          # misread later.
          #
          # If neither resolves, AGP downloads the platform itself (the
          # licences are already accepted), so this warns rather than fails,
          # and the `ls` below records what was actually there.
          sdkmanager "platform-tools" "build-tools;${BUILD_TOOLS}" || true
          sdkmanager "platforms;android-${COMPILE_SDK}.0" \
            || sdkmanager "platforms;android-${COMPILE_SDK}" \
            || echo "::warning::No platforms;android-${COMPILE_SDK} package resolved; letting AGP fetch it."
          echo "--- installed platforms"
          ls "$ANDROID_HOME/platforms" || true

      # Unit tests first, because they are the fastest way to a real answer and
      # the protocol ones fail on a server change that compiles perfectly well.
      - name: Unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        working-directory: android
        run: ./gradlew :app:lint --stacktrace

      - name: Debug build
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      # An UNSIGNED release, on purpose. This job holds no Play upload
      # keystore and never will; what it proves is that R8, the resource
      # shrinker and `proguard-rules.pro` survive the release variant, which
      # is where a kotlinx-serialization or WebRTC rule goes missing and the
      # app crashes on a tester's phone and nowhere else. Play signing stays
      # a human step, documented in docs/ANDROID_RELEASE.md.
      - name: Release build (unsigned, shrinker check)
        working-directory: android
        run: ./gradlew :app:assembleRelease --stacktrace

      # The key that signs the GitHub-beta APK, and the reason this file no
      # longer has an `actions/cache` step here.
      #
      # It used to sign with whatever `~/.android/debug.keystore` the runner
      # generated, and keep that file alive between runs in an Actions cache
      # under a stable key. That is not durable and cannot be: GitHub evicts a
      # cache after **seven days without a read**, and the Android workflow only
      # runs when `android/**` or a protocol path changes. A quiet fortnight
      # therefore rotated the signing key, silently, and the next publish went
      # out signed by a stranger. Android refuses to install an update over a
      # different signature, so every tester holding an older APK simply could
      # not update, with no error worth reading, and nothing in the build went
      # red. That is what happened to the 0.3.0 publish.
      #
      # So the key is a repository secret now, decoded to a runner-local file
      # that the job deletes with itself. Do not commit a keystore. Do not put
      # this signing config on `release`: that one is Play's, and Play refuses
      # anything but the upload key.
      - name: Decode the sideload signing key
        id: sideload_key
        shell: bash
        env:
          SIDELOAD_KEYSTORE_B64: ${{ secrets.ANDROID_SIDELOAD_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          publishing=0
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; }; then
            publishing=1
          fi
          echo "publishing=${publishing}" >> "$GITHUB_OUTPUT"

          if [ -z "${SIDELOAD_KEYSTORE_B64}" ]; then
            if [ "$publishing" = 1 ]; then
              echo "::error::ANDROID_SIDELOAD_KEYSTORE_B64 is empty, so this run would sign android-beta with a throwaway debug key and break in-place updates for every existing tester. Set the four ANDROID_SIDELOAD_* Actions secrets (see docs/ANDROID.md, 'The sideload signing key') before publishing. The keystore is backed up at ~/.config/pqp/android-sideload-keystore/ on the maintainer's machine."
              exit 1
            fi
            # Fork PRs get no secrets at all. Those runs still have to compile
            # and still upload an artifact; they just sign it with the runner's
            # own debug key, which nobody updates over.
            echo "::warning::No sideload keystore secret; this APK is signed with the runner's debug key and cannot update an installed beta. Expected on a fork PR."
            exit 0
          fi

          install -d -m 700 "$RUNNER_TEMP/android-signing"
          printf '%s' "$SIDELOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/android-signing/sideload.jks"
          chmod 600 "$RUNNER_TEMP/android-signing/sideload.jks"
          echo "keystore=$RUNNER_TEMP/android-signing/sideload.jks" >> "$GITHUB_OUTPUT"

      - name: Sideload APK (prod API, signed with the durable beta key)
        working-directory: android
        env:
          # Publishable, the same value Pages already bakes into the web
          # client. Empty on fork PRs (GitHub will not hand secrets to a
          # fork); those runs still compile, they just cannot sign in.
          PQP_CLERKPUBLISHABLEKEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          # Empty when the secret is absent, and `build.gradle.kts` then falls
          # back to the debug keystore. The step above is what makes that
          # fallback impossible on a publishing run.
          PQP_SIDELOADKEYSTOREFILE: ${{ steps.sideload_key.outputs.keystore }}
          PQP_SIDELOADKEYSTOREPASSWORD: ${{ secrets.ANDROID_SIDELOAD_KEYSTORE_PASSWORD }}
          PQP_SIDELOADKEYALIAS: ${{ secrets.ANDROID_SIDELOAD_KEY_ALIAS }}
          PQP_SIDELOADKEYPASSWORD: ${{ secrets.ANDROID_SIDELOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          publishing='${{ steps.sideload_key.outputs.publishing }}'
          if [ "$publishing" = 1 ] && [ -z "${PQP_CLERKPUBLISHABLEKEY}" ]; then
            echo "::error::VITE_CLERK_PUBLISHABLE_KEY is empty. The sideload APK would compile and then refuse to sign in (AuthMode.Misconfigured). Set the Actions secret (same value as the Pages build) before publishing android-beta."
            exit 1
          fi
          if [ -z "${PQP_CLERKPUBLISHABLEKEY}" ]; then
            echo "::warning::No Clerk publishable key; sideload APK is a compile check only (will not sign in against api.pqp.gg)."
          fi
          ./gradlew :app:assembleSideload --stacktrace
          cp app/build/outputs/apk/sideload/app-sideload.apk app/build/outputs/apk/sideload/pqp.apk

      # Reads the signature off the artifact rather than trusting the config
      # that produced it, which is the only version of this check that would
      # have caught the cache eviction. A certificate fingerprint is public by
      # construction (every installed APK exposes it), so pinning it in a
      # workflow file leaks nothing and turns a silent key rotation into a red
      # build.
      #
      # It is also the value `client/public/.well-known/assetlinks.json` has to
      # list for https://pqp.gg/app/invite/<code> to open the app directly.
      # Rotating the key on purpose means editing both this constant and that
      # file, and telling testers to reinstall.
      - name: Verify the sideload signature
        if: steps.sideload_key.outputs.keystore != ''
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"
          if [ ! -x "$apksigner" ]; then
            apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          fi
          certs=$("$apksigner" verify --print-certs app/build/outputs/apk/sideload/pqp.apk)
          echo "$certs"
          actual=$(echo "$certs" | awk '/SHA-256 digest:/ { print $NF; exit }')
          expected=$(echo "$SIDELOAD_CERT_SHA256" | tr -d ':' | tr 'A-Z' 'a-z')
          if [ "$actual" != "$expected" ]; then
            echo "::error::The sideload APK is signed by ${actual}, not by the durable beta key ${expected}. Testers could not update over this build. Either a secret was replaced or the key was rotated without updating SIDELOAD_CERT_SHA256 in this workflow and client/public/.well-known/assetlinks.json."
            exit 1
          fi
          {
            echo "### Sideload signing certificate"
            echo
            echo "SHA-256 (package \`gg.pqp.app\`), matches the pinned key:"
            echo
            echo "\`${SIDELOAD_CERT_SHA256}\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarise
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "### Android"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| compileSdk | ${COMPILE_SDK} |"
            echo "| JDK | $(java -version 2>&1 | head -1) |"
            for apk in android/app/build/outputs/apk/*/*.apk; do
              [ -f "$apk" ] || continue
              echo "| $(basename "$apk") | $(( $(stat -c%s "$apk") / 1024 / 1024 )) MB |"
            done
            tests=$(find android/app/build/test-results -name 'TEST-*.xml' 2>/dev/null | wc -l)
            echo "| unit test classes | ${tests} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/**
            android/app/build/test-results/**
          if-no-files-found: warn
          retention-days: 14

      # The artifact a human installs to check a change by hand, so that
      # "does it actually run" does not need the one laptop either.
      #
      # It is the plain debug build, so it points at `http://localhost:3001` and
      # needs `adb reverse tcp:3001 tcp:3001` and a local server, exactly like a
      # build off the laptop. It is deliberately NOT pointed at api.pqp.gg: a
      # debug build carries no Clerk publishable key, so it would authenticate
      # with the dev bypass token, which the hosted API refuses.
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pqp-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload sideload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pqp-android-sideload
          path: android/app/build/outputs/apk/sideload/pqp.apk
          if-no-files-found: error
          retention-days: 14

  # Rolling GitHub Release on the stable tag `android-beta`, never `latest`.
  # `latest` is the Electron version tag; marking this release latest would
  # either 404 the desktop updater or serve an APK to it. Prerelease +
  # make_latest: false is belt and braces.
  #
  # PRs upload the artifact above and stop here. Publishing from a PR would
  # put unreviewed code on the public download URL.
  publish-sideload:
    name: Publish sideload APK
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download sideload APK
        uses: actions/download-artifact@v4
        with:
          name: pqp-android-sideload
          path: dist

      - name: Publish to android-beta
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-beta
          name: Android beta
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: dist/pqp.apk
          body: |
            Sideload APK for the closed Play window (`pqp.gg/android`).

            Built by `.github/workflows/android.yml` from the `sideload`
            variant: production API, R8, signed with the durable beta key
            (certificate SHA-256 pinned in that workflow, so every build here
            updates in place over the last one). Not the Play upload key, so
            the listing cannot update over this install. Uninstall this build
            when the store opens.

            Filename is stable (`pqp.apk`) so the download URL does not
            change when the binary does.
