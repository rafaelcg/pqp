name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The authorization matrix is covered by integration tests that run against a
    # real database — a mocked one would not catch a wrong SQL predicate.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pqp
          POSTGRES_PASSWORD: pqp
          POSTGRES_DB: pqp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pqp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://pqp:pqp@localhost:5432/pqp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Version comes from the root package.json "packageManager" field.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @pqp/shared build

      - name: Check i18n catalogues
        run: pnpm --filter @pqp/client i18n:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Before the tests: the DB-backed suites under server/test import the
      # compiled output from server/dist.
      - name: Build server
        run: pnpm --filter @pqp/server build

      - name: Test
        run: pnpm test

      # `scripts/` is outside the pnpm workspace, so `pnpm test` never saw it.
      # That was fine while the monitor was only "fetch a URL, look at the
      # status code", and stopped being fine when it grew a matcher that decides
      # whether something we published in public is still true. The first run of
      # these tests found a real bug: the Portuguese "sem som" did not match,
      # which is the most natural way to write the exact claim the check exists
      # to catch. The error heartbeat added the second body of real logic —
      # a log parser, an ignore-rule table and a set of thresholds — and its
      # tests are in the same glob.
      # A glob, not the directory. `node --test scripts/monitor/` collects one
      # phantom test and fails; the glob collects every *.test.mjs and passes.
      - name: Test monitor scripts
        run: node --test scripts/monitor/*.test.mjs

      # Colour-contrast floors and the count of colour literals living outside
      # the token layer. Both are ratchets: they only move the right way.
      - name: Benchmark theme tokens
        run: pnpm --filter @pqp/client bench:tokens
        env:
          BENCH_MAX_LEAKS: "0"

      - name: Build client
        env:
          # Publishable key is public; placeholder keeps the Vite build green in PRs.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY || 'pk_test_ci_placeholder' }}
          # Never ship a CI artifact that accepts the public dev token.
          VITE_DEV_AUTH_BYPASS: "false"
        run: pnpm --filter @pqp/client build

      # The Vite build is NOT enough. Cloudflare Pages bundles
      # `client/functions/` with esbuild, separately and with different rules,
      # and that step only ever ran inside the deploy. On 22 Aug 2026 a `?raw`
      # markdown import reachable from the middleware passed CI, passed the
      # Vite build, and then failed the deploy with "No loader is configured
      # for .md files" — leaving the API on the new commit and the site on the
      # old one. Bundling here costs seconds and turns that into a red PR.
      - name: Bundle Pages functions
        working-directory: client
        run: npx wrangler pages functions build --outfile=/tmp/functions-bundle.js

  # The Playwright suite runs on one worker (shared DB, computed-colour
  # assertions) and took ~18 minutes serial, which dominated the old single
  # job's ~24 minutes. Four shards, each with its own postgres service, bring
  # the wall clock down without touching the worker count. The suite boots the
  # server via `tsx watch` and the client via `vite dev` (see
  # client/playwright.config.ts webServer), so only @pqp/shared needs a build
  # here.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pqp
          POSTGRES_PASSWORD: pqp
          POSTGRES_DB: pqp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pqp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://pqp:pqp@localhost:5432/pqp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Version comes from the root package.json "packageManager" field.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @pqp/shared build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @pqp/client exec playwright install --with-deps chromium

      # A cache hit restores the browser binaries but not the apt packages the
      # runner image may be missing; install-deps alone is cheap.
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @pqp/client exec playwright install-deps chromium

      - name: E2E (shard ${{ matrix.shard }}/4)
        run: pnpm --filter @pqp/client e2e --shard=${{ matrix.shard }}/4
        env:
          E2E_DATABASE_URL: postgres://pqp:pqp@localhost:5432/pqp

      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # upload-artifact@v4 hard-fails on duplicate names across matrix jobs.
          name: playwright-report-${{ matrix.shard }}
          path: |
            client/test-results
            client/e2e-results.json
          retention-days: 7
