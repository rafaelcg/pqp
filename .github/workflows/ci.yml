name: CI

# A docs-only (or Android/iOS/monitor-only) change does not need Playwright.
# paths-ignore skips the run when EVERY file in the push matches; a mixed PR
# that also touches client/ or server/ still runs.
# The two lists are duplicated: GitHub does not expand YAML anchors (an
# alias here becomes an empty filter and the workflow runs on everything).
# Do not add tools/support-bot or scripts/monitor — those have tests here.
# Do not add tools/admin-dashboard, tools/hls-edge or tools/ambient — root
# `eslint .` lints all three, and admin-dashboard and hls-edge each have a
# `node --test` step of their own below.
# Do not add **/*.md — blog/What's New markdown lives under client/.
# If branch protection later requires `checks` / `e2e`, a skipped paths-ignore
# run is treated as pending forever. Do not require those checks without a
# filter that still reports success.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "android/**"
      - "ios/**"
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "ARCHITECTURE.md"
      - "LICENSE"
      - ".github/FUNDING.yml"
      - ".github/workflows/android.yml"
      - ".github/workflows/electron.yml"
      - ".github/workflows/monitor-*.yml"
      - ".github/workflows/pr-size-label.yml"
      - ".github/workflows/provision-turn.yml"
      - "tools/sfu/**"
      - "tools/log-shipper/**"
  pull_request:
    branches: [main]
    # Never add `labeled` here. Every event on a PR shares the concurrency
    # group below, so a label event cancelled the real run in progress and
    # then had nothing of its own to run: on 2026-09-29 eight PRs ended with
    # every check cancelled after `restarts-api` was added. The `freeze`
    # announcement that needed `labeled` lives in announce-freeze.yml.
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "docs/**"
      - "android/**"
      - "ios/**"
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "ARCHITECTURE.md"
      - "LICENSE"
      - ".github/FUNDING.yml"
      - ".github/workflows/android.yml"
      - ".github/workflows/electron.yml"
      - ".github/workflows/monitor-*.yml"
      - ".github/workflows/pr-size-label.yml"
      - ".github/workflows/provision-turn.yml"
      - "tools/sfu/**"
      - "tools/log-shipper/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The old single `checks` job ran lint, typecheck, every test suite and the
  # builds one after the other (~12-15 min, 8.5-11 of them the Test step). It is
  # split into `static` (lint, typecheck, builds, the small node suites),
  # `test-server` (the DB-backed vitest suite, sharded) and `test-client`
  # (every other vitest / node-test workspace). The `checks` job further down is
  # an aggregator that keeps the old name, so a branch protection rule that
  # requires `checks` keeps working: it is green only when all of these are.
  static:
    name: lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # No Postgres service here: nothing in this job reads a database.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Check i18n catalogues
        run: pnpm --filter @pqp/client i18n:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The lockfile pattern for the first-party apps: builds every app under
      # apps/ into a scratch folder and fails when server/src/apps/catalog.json
      # (what the API loads at boot) differs from what the sources build to, or
      # when a released (id, version) would get different bytes ("bump the
      # version"). The second half compares with origin/main, which a shallow PR
      # checkout does not have, so fetch it first. docs/APPS.md, Packaging.
      - name: Check the apps catalog
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          pnpm apps:check

      # What `npm publish` would upload for @pqp/app-sdk: builds dist/, stages
      # publish/ and FAILS when the tarball is not self-contained (a leaked
      # @pqp/shared or zod import, a test file, a private manifest, a
      # .d.ts a strict consumer cannot type-check). Nothing is published; the
      # release workflow is separate and manual. packages/app-sdk/PUBLISHING.md.
      - name: Check the app-sdk package
        run: pnpm --filter @pqp/app-sdk package

      # The docs site for people who build apps (docs-apps/). The build fails on
      # a dead internal link. Nothing deploys it yet (docs-apps/README.md).
      - name: Build the apps docs
        run: pnpm docs:apps:build

      # `scripts/` is outside the pnpm workspace, so `pnpm test` never saw it.
      # That was fine while the monitor was only "fetch a URL, look at the
      # status code", and stopped being fine when it grew a matcher that decides
      # whether something we published in public is still true. The first run of
      # these tests found a real bug: the Portuguese "sem som" did not match,
      # which is the most natural way to write the exact claim the check exists
      # to catch. The error heartbeat added the second body of real logic —
      # a log parser, an ignore-rule table and a set of thresholds — and its
      # tests are in the same glob.
      # A glob, not the directory. `node --test scripts/monitor/` collects one
      # phantom test and fails; the glob collects every *.test.mjs and passes.
      - name: Test monitor scripts
        run: node --test scripts/monitor/*.test.mjs

      # The API box's deploy script runs as root against production and had no
      # test at all. These cut the Caddyfile layout and integrity-check
      # functions out of the real script and run them against a stubbed
      # `docker`; no daemon, no root.
      - name: Test api-host deploy script
        run: |
          bash -n tools/api-host/pqp-deploy.sh
          bash tools/api-host/test-pqp-deploy.sh

      # The Flatpak release bump (flatpak/bump.mjs) is outside the workspace
      # too, and `.github/workflows/flatpak-manifest.yml` runs it unattended
      # on every published desktop release.
      - name: Test Flatpak scripts
        run: node --test flatpak/*.test.mjs

      # Same reason as the monitor scripts above, with a sharper edge: this one
      # decides whether merging drops every live WebSocket. It used to be a
      # `grep` inside deploy-api-fly.yml, where the only way to learn what it
      # did was to merge something and watch.
      - name: Test deploy relevance
        run: node --test scripts/deploy/*.test.mjs

      # `tools/support-bot` is outside the workspace too, for the reason its
      # README gives, so `pnpm test` never saw it either. It is the one thing in
      # this repo that writes into a public channel on its own judgement: the
      # trigger gates, the outbound screen, the daily ceiling and the rules for
      # answering a question nobody answered are all decided by code that CI was
      # not running. A green PR that touches it should mean something.
      - name: Test support bot
        run: node --test tools/support-bot/test/*.test.js

      # `tools/admin-dashboard` is outside the workspace as well. Almost all of
      # it is markup and rendering, which CI cannot judge — except the three
      # verdicts on the "agora" screen, which are sentences an operator acts on
      # ("storage está a 3x o normal dele") and cannot check by looking at
      # them. A wrong figure elsewhere on that page is visible; a wrong verdict
      # is believed. So the arithmetic behind them lives in one file with no
      # DOM and no fetch, and this runs it.
      - name: Test dashboard insights
        run: node --test tools/admin-dashboard/test/*.test.js

      # `tools/hls-edge` is outside the workspace too, same reasons as
      # admin-dashboard above. Its Worker logic (routing, caching, CORS) is
      # markup-free but Workers-runtime-specific and not worth a Miniflare
      # dependency here; what IS worth pinning in CI is the token check, since
      # a drift from `server/src/voice/hls-viewer-token.ts`'s HMAC scheme
      # fails open as "every viewer sees 401" during a party. It is plain Web
      # Crypto JS for exactly this reason — the same module runs under
      # `node --test` and inside the Worker unmodified. See
      # `tools/hls-edge/README.md` "Why a port, and why plain JS".
      #
      # A handful of tests (`ll-playlist-origin.test.mjs`, `index.test.mjs`)
      # exercise a REAL TypeScript class/function rather than a port, and
      # import it from the compiled `dist/` output — see either file's own
      # header for why `.ts` source can't be imported directly under
      # `node --test`. `npm install` + the package's own `pretest` (`tsc -p
      # tsconfig.test-build.json`) has to run here first, or those two files
      # fail with a bare "cannot find module ../dist/..." before a single
      # assertion runs.
      - name: Build HLS edge (dist/ some tests import)
        working-directory: tools/hls-edge
        run: |
          npm install
          npm run pretest
      - name: Test HLS edge playlist token check
        run: node --test tools/hls-edge/test/*.test.mjs

      # The one test that opens the desktop app.
      #
      # Every other Electron test in this repo is a unit test of a helper, so
      # none of them can see the failure that is easiest to ship and worst to
      # miss: the binary starts and shows a white window. A bad require in
      # main.js, a preload that throws, a nav policy that blocks its own
      # origin. All of those pass `pnpm test` and are obvious one second after
      # double-clicking the app.
      #
      # Cheap on purpose: it launches the real main.js against a fixture page
      # on a local port, so no API, no Clerk, no network and no built client.
      # It uses Electron's own Chromium through Playwright's `_electron`, so
      # there is no browser to download and no `playwright install` step. Under
      # xvfb because the shell wants a display; a few seconds, one process.
      - name: Smoke test the desktop shell
        run: xvfb-run --auto-servernum pnpm --filter @pqp/electron test:smoke

      # Colour-contrast floors and the count of colour literals living outside
      # the token layer. Both are ratchets: they only move the right way.
      - name: Benchmark theme tokens
        run: pnpm --filter @pqp/client bench:tokens
        env:
          BENCH_MAX_LEAKS: "0"

      - name: Build client
        env:
          # Publishable key is public; placeholder keeps the Vite build green in PRs.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY || 'pk_test_ci_placeholder' }}
          # Never ship a CI artifact that accepts the public dev token.
          VITE_DEV_AUTH_BYPASS: "false"
        # `package.json` build is `tsc && vite build`. Typecheck already ran
        # tsc --noEmit for the client; do not pay for it a second time.
        run: pnpm --filter @pqp/client exec vite build

      # The Vite build is NOT enough. Cloudflare Pages bundles
      # `client/functions/` with esbuild, separately and with different rules,
      # and that step only ever ran inside the deploy. On 22 Aug 2026 a `?raw`
      # markdown import reachable from the middleware passed CI, passed the
      # Vite build, and then failed the deploy with "No loader is configured
      # for .md files" — leaving the API on the new commit and the site on the
      # old one. Bundling here costs seconds and turns that into a red PR.
      - name: Bundle Pages functions
        working-directory: client
        run: npx --yes wrangler@4.149.0 pages functions build --outfile=/tmp/functions-bundle.js

  # The server suite (~5,200 tests in ~335 files) against a real database; it
  # was ~8.5 of the old job's 12 minutes. Sharded by file (`vitest --shard`):
  # every file runs in exactly one shard, and each shard has a runner and a
  # Postgres of its own with PQP_TEST_DB_WORKERS databases inside it. The
  # authorization matrix is covered by integration tests that run against a real
  # database; a mocked one would not catch a wrong SQL predicate.
  test-server:
    name: test server (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # The whole server suite took about ten minutes on a normal runner before it
    # was sharded; this is the margin for one shard on a slow runner.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: pqp
          POSTGRES_PASSWORD: pqp
          POSTGRES_DB: pqp
        ports:
          - 5432:5432
        # CI data is disposable, so keep postgres off the runner's disk.
        # The DB-backed suites are commit-latency-bound (thousands of tiny
        # transactions and truncates, each an fsync), and hosted-runner disk
        # latency varies wildly between VMs: the same Test step measured 3m06
        # on one runner and 14+ min (cancelled) on another, with identical
        # container args. tmpfs makes the fsync a memory write, which removes
        # that lottery for the unit suites and the e2e shards alike.
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U pqp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://pqp:pqp@localhost:5432/pqp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      # Before the tests: the DB-backed suites under server/test import the
      # compiled output from server/dist.
      - name: Build server
        run: pnpm --filter @pqp/server build

      - name: Test server (shard ${{ matrix.shard }}/3)
        run: pnpm --filter @pqp/server test --shard=${{ matrix.shard }}/3
        env:
          # Three files at once, each on a database of its own
          # (server/test/setup/worker-databases.ts). Not more: the runner has
          # four cores, and at four server workers it sat at 3% idle and
          # timing-sensitive tests started to starve.
          PQP_TEST_DB_WORKERS: "3"

  # Every vitest / node-test workspace except the server: client, shared,
  # electron's helper tests and tools/watch-party-load. None needs Postgres.
  test-client:
    name: test client, shared, electron
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Test
        # `!pqp` excludes the root package: with a filter in play pnpm
        # includes it, and its `test` script is `pnpm run -r test`, which
        # would run the server suite here too (with no database).
        run: pnpm run -r --parallel --filter '!@pqp/server' --filter '!pqp' test

  # Aggregator, named for the job it replaced. Required status checks match on
  # the job name, so this keeps a rule on `checks` meaningful without anyone
  # editing repo settings. `always()` so a failed or cancelled needed job turns
  # this red instead of skipping it (a skipped required check counts as passing).
  checks:
    name: checks
    needs: [static, test-server, test-client]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every checks job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null

  # The Playwright suite runs one worker per database (shared server state,
  # computed-colour assertions), so it is split by `--shard` and the shards run
  # side by side, each in a LANE: its own API port, client bundle and database
  # (scripts/ci/e2e-lanes.sh). Two lanes share a runner: measured on the
  # 4-core hosted runner, two lanes finish ~1.6x faster than the same two
  # shards one after the other, at ~77% CPU, and every runner not started
  # saves ~1.5 min of setup and one of the account's 20 job slots (which is
  # what PRs queued behind). Three lanes would oversubscribe it, and the media
  # specs are the ones that flake when starved of CPU.
  #
  # The client is a `vite build` served by `vite preview`, not `vite dev`: on a
  # hosted runner the dev server cost ~40% of every test, serving the app as
  # hundreds of unbundled modules on each fresh page.
  #
  # Voice / camera / screen-share files are a separate project (chromium-media)
  # so Playwright's file-level shard does not dump all of them onto one lane.
  # core = everything else + the Pixel phone spec; media = the slow files.
  # WebKit is not installed: the iPhone project is local-only (PW_WEBKIT=1).
  # The server runs from source (`tsx watch`, see client/playwright.config.ts
  # webServer), so only @pqp/shared needs a build here.
  #
  # Balance. Lane minutes measured before this split (two lanes per runner):
  # core as four shards 11.3 / 13.3 / 8.3 / 7.9, media 3.3 / 6.0 / 5.6, stale
  # bundle ~5.8 and camera sync ~2.5, the last two both on the media 1/3 job
  # (12.5 min). Playwright balances shards by test count, not duration (one
  # eight-shard core run came out 2.6m to 7.5m per lane, and three media shards
  # 3.3m / 6.9m / 6.3m), so core is ten shards and media four: more, smaller
  # pieces average out the heavy files. Stale bundle and camera sync, which
  # need no lanes, are jobs of their own.
  e2e-shard:
    name: e2e (${{ matrix.suite }} ${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
            projects: --project=chromium --project=mobile-pixel
            total: 10
            shards: "1 2"
            label: 1+2/10
          - suite: core
            projects: --project=chromium --project=mobile-pixel
            total: 10
            shards: "3 4"
            label: 3+4/10
          - suite: core
            projects: --project=chromium --project=mobile-pixel
            total: 10
            shards: "5 6"
            label: 5+6/10
          - suite: core
            projects: --project=chromium --project=mobile-pixel
            total: 10
            shards: "7 8"
            label: 7+8/10
          - suite: core
            projects: --project=chromium --project=mobile-pixel
            total: 10
            shards: "9 10"
            label: 9+10/10
          - suite: media
            projects: --project=chromium-media
            total: 4
            shards: "1 2"
            label: 1+2/4
          - suite: media
            projects: --project=chromium-media
            total: 4
            shards: "3 4"
            label: 3+4/4
          # No lanes: camera sync needs no API and no database (about 3 min).
          - suite: camera-sync
            label: synthetic live HLS
            camera: true
          # No lanes: the stale-bundle suite needs no API and no database, only
          # its own builds and a real service worker (Chromium and Firefox).
          - suite: stale-bundle
            label: real service worker
            stale: true
          # No lanes: the app frame suite (client/playwright.app-frame.config.ts)
          # runs the real frame controller, bridge host and SDK in a sandboxed
          # frame, and the page's frame-src policy against a canary server. It
          # needs no API and no database. Chromium and Firefox here; WebKit is
          # local-only like the iPhone project.
          - suite: app-frame
            label: sandboxed frame policy
            appframe: true
          # No lanes: Locadora in a real sandboxed frame under its real CSP, with
          # generated test patterns and a canary server that must see nothing
          # (apps/locadora/e2e). No API, no database. Chromium only here; the
          # three engines run locally (`pnpm --filter @pqp-apps/locadora e2e`).
          - suite: apps-sandbox
            label: Locadora in the sandbox
            apps: true

    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: pqp
          POSTGRES_PASSWORD: pqp
          POSTGRES_DB: pqp
        ports:
          - 5432:5432
        # CI data is disposable, so keep postgres off the runner's disk.
        # See the note on the test-server job: tmpfs removes the runner-disk
        # lottery for the DB-backed suites and the e2e shards alike.
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U pqp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://pqp:pqp@localhost:5432/pqp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @pqp/client exec playwright install --with-deps chromium

      # A cache hit restores the browser binaries but not the apt packages the
      # runner image may be missing; install-deps alone is cheap.
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @pqp/client exec playwright install-deps chromium

      # Firefox runs only the stale-bundle install specs, so only that job
      # needs it. Its own cache key: the Chromium cache above is immutable once
      # saved and cannot pick Firefox up.
      - name: Cache Playwright Firefox
        if: matrix.stale || matrix.appframe
        id: playwright-firefox-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright/firefox-*
          key: playwright-firefox-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Firefox
        if: (matrix.stale || matrix.appframe) && steps.playwright-firefox-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @pqp/client exec playwright install --with-deps firefox

      - name: Install Playwright Firefox system deps
        if: (matrix.stale || matrix.appframe) && steps.playwright-firefox-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @pqp/client exec playwright install-deps firefox

      - name: E2E (${{ matrix.suite }} ${{ matrix.label }})
        if: matrix.shards
        run: scripts/ci/e2e-lanes.sh "${{ matrix.projects }}" ${{ matrix.total }} ${{ matrix.shards }}

      # Real builds and a real service worker, no API and no database
      # (client/playwright.stale-bundle.config.ts).
      - name: E2E stale bundle (real service worker)
        if: matrix.stale
        run: pnpm --filter @pqp/client e2e:stale-bundle

      # The sandboxed app frame, the bridge and the page's frame-src policy in
      # real browsers (client/e2e/app-frame/), no API and no database.
      - name: E2E app frame (sandbox, frame-src policy, bridge)
        if: matrix.appframe
        run: pnpm --filter @pqp/client e2e:app-frame --project=chromium --project=firefox
      # The apps sandbox, end to end: the real packager's build of Locadora in
      # an `allow-scripts` frame, a generated NES and GBA test pattern (never a
      # game) painted by the real cores, every escape probe failing inside the
      # frame, and a canary server on another port that records nothing.
      - name: E2E apps sandbox (Locadora, test patterns, canary)
        if: matrix.apps
        run: pnpm --filter @pqp-apps/locadora e2e
      # Locadora without an account (client/e2e/locadora-guest/): the real
      # client and API with the guest flags on, the real Locadora build on its
      # own origin, a generated SNES pattern with a canary title, and a failure
      # if the title, the file name or the file's hash is in any request.
      - name: E2E Locadora guest player (no account, canary)
        if: matrix.apps
        env:
          E2E_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm --filter @pqp/client e2e:locadora-guest
      # A game shared into a voice call, MEASURED at the viewer
      # (client/e2e/locadora-share-sound/): two real clients in one call, the
      # real Locadora build running a generated pattern, and the viewer's
      # inbound audio read for the game's tone (must be heard) and for the
      # call's own (must not come back inside the share).
      - name: E2E Locadora share sound (two clients, measured at the viewer)
        if: matrix.apps
        env:
          E2E_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm --filter @pqp/client e2e:locadora-share-sound

      # The presenter's camera held to the film, measured off the pictures
      # (client/playwright.camera-sync.config.ts): the real watch player on a
      # synthetic live film and camera, no API and no database. Real Google
      # Chrome, which the runner image ships (Playwright's Chromium has no
      # H.264), and ffmpeg to make the media. The quick run, about 3 minutes.
      - name: E2E camera sync (real Chrome, synthetic live HLS)
        if: matrix.camera
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pnpm --filter @pqp/client e2e:camera-sync

      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # upload-artifact@v4 hard-fails on duplicate names across matrix jobs.
          name: playwright-report-${{ matrix.suite }}-${{ matrix.total }}-${{ strategy.job-index }}
          path: |
            client/test-results
            client/e2e-results*.json
          retention-days: 7

  # Aggregator for the sharded e2e jobs, named for the job it replaced (see
  # `checks` above). Without it a matrix leg that never started would leave
  # nothing red.
  e2e:
    name: e2e
    needs: [e2e-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every e2e shard passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
