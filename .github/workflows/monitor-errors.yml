name: Monitor (errors)

# "Is the support bot there?", every 15 minutes, reading its state from Fly.
#
# WHAT RUNS: `support-bot-alive`, and only that. `pqp-support` (the QG help
# bot) is still a Fly app, so its machine state and heartbeat are real. The
# API's and worker's log errors are Grafana Loki alerts, which read every line
# (docs/MONITORING.md, "Logs in Grafana Cloud"); a GitHub runner has no SSH key
# and no repo secret that reaches the Vultr box. The old `api-error-rate` check
# read `fly logs` for `pqp-api`; it was removed with the Fly apps on
# 2026-10-22.
#
# WHY THIS IS SEPARATE FROM Monitor (uptime)
#
# The uptime group is availability-shaped: /health answers, the WebSocket
# upgrades, the component probes are green. None of that says a bot that lives
# outside the API is still there. `pqp-support` went down three minutes after
# its first deploy: it exited 0 on purpose (the SIGTERM handler does that),
# Fly's default restart policy read a clean exit as "the job finished" and
# retired the machine, and the bot was simply absent from #ajuda with nothing
# anywhere saying so. A bot that is quietly missing is worse than one that is
# obviously broken, because nobody goes looking.
#
# `fly logs --no-tail` returns roughly the LAST 100 LINES, so the period it
# covers is bounded by VOLUME, NOT TIME. THE 15-MINUTE CRON IS THE SAMPLING
# INTERVAL, NOT THE WINDOW. Do not assume the two are related. GitHub queues
# scheduled runs on public repos at low priority and they are routinely 5-20
# minutes late, so treat detection as "within 15-40 minutes".
#
# NEEDS AN ORG-SCOPED FLY TOKEN: `FLY_ORG_TOKEN`. An app-scoped deploy token
# cannot read `pqp-support`, so `support-bot-alive` SKIPs without it, with
# instructions, rather than reporting a false outage. See docs/MONITORING.md.

on:
  schedule:
    # Offset from :00 and from the uptime cron's :3/:13/:23… so the two do not
    # queue behind each other or hammer the Fly API in the same second.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only — do not open, comment on or close issues"
        type: boolean
        default: false

# Never two at once: the reconciler dedupes against the list of open issues, so
# overlapping runs are the one way it could open a duplicate.
concurrency:
  group: monitor-errors
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Production log error rate
    runs-on: ubuntu-latest
    # Two flyctl calls plus one retry pass. Generous against the ~1 minute this
    # takes, tight enough that a hung `fly logs` cannot sit on the concurrency
    # group until the next run.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Dependency-free Node built-ins on purpose: no `pnpm install` step means
      # nothing between the checkout and the probe can fail and turn the
      # monitor into a false alarm about itself.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # ONE run. Exit codes carry the meaning:
      #   0/1 -> the checks ran; whatever they found is now a GitHub issue, and
      #          the JOB stays green. A failing check must NOT redden the run:
      #          that is a second notification for the same incident, and a
      #          permanently-red Actions tab is how people stop looking.
      #   2   -> the MONITOR is broken. That does fail the job, because GitHub
      #          emails the owner about a failed scheduled workflow by default,
      #          which is the only path left when the notifier itself is down.
      - name: Run error checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Org-scoped: an app-scoped token cannot read pqp-support, which
          # makes support-bot-alive SKIP.
          FLY_ORG_TOKEN: ${{ secrets.FLY_ORG_TOKEN }}
          MONITOR_REPO: ${{ github.repository }}
          # Comma-separated check keys to silence without disabling the monitor.
          # `gh variable set MONITOR_MUTED --body "support-bot-alive"`.
          MONITOR_MUTED: ${{ vars.MONITOR_MUTED }}
        run: |
          set +e
          node scripts/monitor/run.mjs errors --alert \
            ${{ inputs.dry_run && '--dry-run' || '' }} 2>&1 | tee /tmp/monitor-errors.log
          code=${PIPESTATUS[0]}
          set -e
          {
            echo '### Error heartbeat'
            echo '```'
            cat /tmp/monitor-errors.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" = "2" ]; then
            echo "::error::The monitor could not run. Nothing is reading the logs until this is fixed."
            exit 1
          fi
          exit 0
