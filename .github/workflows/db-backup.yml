name: DB backup

# Nightly logical backup of the production Postgres (Fly Managed Postgres,
# cluster pqp-db, database fly-db) into a private R2 bucket, 30-day retention.
#
# Why this exists: on 2026-09-05 a failed plan resize left the managed cluster
# degraded and the only recovery was Fly's PITR, which would not accept a point
# inside the last ~20 minutes. Twenty minutes of writes were lost. This dump is
# the copy we own. Restore procedure: docs/DB_RUNBOOK.md.
#
# Secrets (names only; never print values):
#   BACKUP_DATABASE_URL          the ONE database this job reads. Point it at
#                                production only. Ideally a read-only role, see
#                                docs/DB_RUNBOOK.md "Read-only backup role".
#   R2_BACKUP_BUCKET             bucket name
#   R2_ACCOUNT_ID                Cloudflare account id, builds the S3 endpoint
#   R2_BACKUP_ENDPOINT           optional, overrides the endpoint built from
#                                R2_ACCOUNT_ID (any S3-compatible host)
#   R2_BACKUP_ACCESS_KEY_ID      R2 API token scoped to that bucket, Object
#   R2_BACKUP_SECRET_ACCESS_KEY  Read & Write
#
# This workflow reads exactly one connection string, BACKUP_DATABASE_URL. It
# never touches the API's DATABASE_URL or anything staging. If the dump is
# smaller than 1 MB, or the upload fails, the job goes red on purpose.

on:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC, 01:17 in São Paulo, off the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIN_BYTES: "1048576" # 1 MB; a smaller dump means the wrong database or an empty one
      RETENTION_DAYS: "30"
      KEY_PREFIX: "pqp-db"
    steps:
      - name: Check secrets are present
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BACKUP_ENDPOINT: ${{ secrets.R2_BACKUP_ENDPOINT }}
          R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in BACKUP_DATABASE_URL R2_BACKUP_BUCKET R2_BACKUP_ACCESS_KEY_ID R2_BACKUP_SECRET_ACCESS_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing secret $name"
              missing=1
            fi
          done
          if [ -z "${R2_ACCOUNT_ID:-}" ] && [ -z "${R2_BACKUP_ENDPOINT:-}" ]; then
            echo "::error::Set R2_ACCOUNT_ID or R2_BACKUP_ENDPOINT"
            missing=1
          fi
          # Refuse anything that looks like a local or staging target. Cheap
          # guard, not a security boundary: the secret is the boundary.
          case "$BACKUP_DATABASE_URL" in
            *localhost*|*127.0.0.1*|*staging*|*pqp_test*)
              echo "::error::BACKUP_DATABASE_URL points at a local, test or staging database"
              missing=1
              ;;
          esac
          [ "$missing" = 0 ]

      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql-client-17
          pg_dump --version

      - name: Dump
        id: dump
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          # pg_dump reads the URL from the environment; it is never echoed and
          # never appears on a command line (ps, job summary, error output).
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          day="$(date -u +%Y-%m-%d)"
          file="fly-db-${stamp}.dump.gz"
          export PGCONNECT_TIMEOUT=15
          # --no-owner / --no-privileges: the restore target is a different
          # cluster with different role names (local docker, a fresh MPG).
          pg_dump --dbname="$BACKUP_DATABASE_URL" \
            --format=custom --compress=0 --no-owner --no-privileges \
            --file=dump.custom
          gzip -9 -c dump.custom > "$file"
          rm -f dump.custom
          bytes=$(stat -c %s "$file")
          echo "dump=${file} ${bytes} bytes"
          if [ "$bytes" -lt "$MIN_BYTES" ]; then
            echo "::error::Dump is ${bytes} bytes, under the ${MIN_BYTES} byte floor. Wrong database, empty database, or a truncated dump. Nothing was uploaded."
            exit 1
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "key=${KEY_PREFIX}/${day}/${file}" >> "$GITHUB_OUTPUT"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BACKUP_ENDPOINT: ${{ secrets.R2_BACKUP_ENDPOINT }}
          FILE: ${{ steps.dump.outputs.file }}
          KEY: ${{ steps.dump.outputs.key }}
          BYTES: ${{ steps.dump.outputs.bytes }}
        run: |
          set -euo pipefail
          endpoint="${R2_BACKUP_ENDPOINT:-https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com}"
          # R2 does not implement the checksum trailers newer aws-cli versions
          # send by default.
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
          export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          aws --endpoint-url "$endpoint" s3api put-object \
            --bucket "$R2_BACKUP_BUCKET" --key "$KEY" --body "$FILE" \
            --content-type application/gzip >/dev/null
          # Read it back: the object must exist with exactly the bytes we sent.
          remote=$(aws --endpoint-url "$endpoint" s3api head-object \
            --bucket "$R2_BACKUP_BUCKET" --key "$KEY" --query ContentLength --output text)
          if [ "$remote" != "$BYTES" ]; then
            echo "::error::Uploaded object is ${remote} bytes, local file is ${BYTES}"
            exit 1
          fi
          echo "Uploaded s3://${R2_BACKUP_BUCKET}/${KEY} (${BYTES} bytes)"
          echo "### DB backup" >> "$GITHUB_STEP_SUMMARY"
          echo "- key: \`${KEY}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- size: ${BYTES} bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Prune backups older than retention
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BACKUP_ENDPOINT: ${{ secrets.R2_BACKUP_ENDPOINT }}
        run: |
          set -euo pipefail
          endpoint="${R2_BACKUP_ENDPOINT:-https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com}"
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
          export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          cutoff=$(date -u -d "${RETENTION_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)
          # Only ever delete under our own prefix, and only when the bucket
          # still holds at least one newer dump (the one we just uploaded), so
          # a clock or listing bug cannot empty the bucket.
          listing=$(aws --endpoint-url "$endpoint" s3api list-objects-v2 \
            --bucket "$R2_BACKUP_BUCKET" --prefix "${KEY_PREFIX}/" --output json)
          newer=$(echo "$listing" | jq --arg c "$cutoff" '[.Contents[]? | select(.LastModified >= $c)] | length')
          if [ "$newer" -lt 1 ]; then
            echo "::warning::No dump newer than ${cutoff} listed; skipping prune"
            exit 0
          fi
          old=$(echo "$listing" | jq -r --arg c "$cutoff" '.Contents[]? | select(.LastModified < $c) | .Key')
          count=0
          for key in $old; do
            aws --endpoint-url "$endpoint" s3api delete-object --bucket "$R2_BACKUP_BUCKET" --key "$key"
            echo "pruned $key"
            count=$((count + 1))
          done
          echo "Pruned ${count} object(s) older than ${RETENTION_DAYS} days"
          echo "- pruned: ${count} object(s) older than ${cutoff}" >> "$GITHUB_STEP_SUMMARY"
