name: Deploy API

# Mirrors Deploy Web: only a successful CI run on main reaches production, so a
# commit that fails typecheck/test/build never deploys. Manual dispatch stays
# available for redeploying without a new commit.
#
# This exists because Railway's own GitHub integration silently stopped firing
# and nobody noticed for five releases — the client kept deploying, the API did
# not, and a new SPA talking to an old API degrades quietly instead of erroring.
# Deploying from CI puts the API on the same evidence trail as everything else.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy Railway
    runs-on: ubuntu-latest
    # Comfortably past the verification poll below, so a stuck deploy fails with
    # that step's message rather than being killed by the job timeout.
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default, which is not
          # necessarily the commit CI just passed on.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Resolve commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check deploy environment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Missing secret RAILWAY_TOKEN. Create a project token in the Railway dashboard (Project Settings -> Tokens, scoped to the production environment) and run: gh secret set RAILWAY_TOKEN"
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # Stamped before the deploy so the build that goes out already knows its
      # own version. --skip-deploys stops this from triggering a second,
      # redundant build of the previous image.
      - name: Stamp version
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway variable set APP_VERSION="${{ steps.commit.outputs.sha }}" \
            --service api --skip-deploys

      # --detach, not --ci. A project token cannot read build logs, so --ci
      # uploads and starts the build correctly and then exits 1 on "Failed to
      # retrieve build log" — a green build reported as a red job, with the
      # verification step below skipped. Detaching makes that check the gate,
      # which is what we actually want to gate on: whether the running process
      # serves this commit, not whether a log stream was readable. The build log
      # URL is printed above either way.
      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service api --detach \
            -m "CI ${{ steps.commit.outputs.sha }}"

      # A green deploy step only means the platform accepted the build. Assert
      # the running process is actually serving this commit, because that is the
      # exact failure this workflow exists to prevent.
      - name: Verify the deployed commit
        env:
          API_URL: ${{ secrets.VITE_API_URL }}
          EXPECTED: ${{ steps.commit.outputs.sha }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::warning::VITE_API_URL is not set, skipping the deployed-commit check"
            exit 0
          fi
          # Wide enough to cover a cold Docker build of the whole workspace
          # (~5-10 min) plus the container swap, since --detach returns as soon
          # as the upload lands rather than when the build finishes.
          for attempt in $(seq 1 80); do
            body=$(curl -fsS --max-time 10 "$API_URL/health" || echo '{}')
            got=$(printf '%s' "$body" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
            if [ "$got" = "$EXPECTED" ]; then
              echo "API is serving $got"
              exit 0
            fi
            echo "attempt $attempt: serving '${got:-unknown}', want '$EXPECTED'"
            sleep 15
          done
          echo "::error::API never reported the deployed commit. It is probably still serving the previous build."
          exit 1
