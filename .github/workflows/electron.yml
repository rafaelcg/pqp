name: Electron

# Packaging is for a desktop artifact, not a merge gate. A docs-only push to
# main used to start three runners, one of them a macOS runner billed at ten
# times the Linux rate. workflow_dispatch always runs. On main (and on a v*
# tag), only a change that can affect the binary does.
#
# The filter is about runner minutes and nothing else. It was first described
# here as dodging "a stale CSC_KEY_PASSWORD"; that reading was wrong, and the
# real cause is written up next to the Package Electron step below. Filtering a
# workflow to cut noise also cuts how often a genuine failure is seen, so the
# macOS job needs a watcher rather than a quieter schedule.
#
# tags and paths both apply: a `v*` tag on a commit that touches none of
# these paths will not run — bump electron/package.json (the version) when
# you cut a release, or use workflow_dispatch.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "electron/**"
      - "client/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/electron.yml"
  workflow_dispatch:

concurrency:
  group: electron-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # electron-builder needs to create/update the draft release it publishes
  # `latest-mac.yml` / `latest.yml` into. Without those files electron-updater
  # reads the feed as "no update available" forever.
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 60 minutes was plenty for mac/linux before this PR. Windows, when
    # SignPath is configured, now blocks on a human approving the signing
    # request (SignPath Foundation's free OSS policy requires manual
    # approval on every release, see docs/DESKTOP.md §4), so the win job
    # needs real headroom. A quiet run finishes in minutes regardless; this
    # only matters the day nobody clicks approve fast.
    timeout-minutes: 180
    # The macOS job used to carry `continue-on-error: true` while it was red
    # over signing (docs/DESKTOP.md 3.8, fixed 2026-09-13). It has been green
    # for three days and dozens of runs since (see "Package Electron" and
    # "Verify macOS signing and notarization" below), so the plaster is off.
    # `fail-fast: false` still keeps Windows and Linux building when mac fails
    # for real, which is the part of that safety net worth keeping.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Version comes from the root package.json "packageManager" field.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @pqp/shared build

      - name: Build client
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY || 'pk_test_ci_placeholder' }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
          # Desktop artifacts are downloadable builds; they must never ship the
          # bypass that accepts the public dev token.
          VITE_DEV_AUTH_BYPASS: "false"
        run: pnpm --filter @pqp/client build

      # Signing and notarization are OPTIONAL. A fork, or a run before the
      # secrets exist, produces an unsigned build and still succeeds — an
      # unsigned build is a broken download, but a red CI on every fork is
      # worse than a warning here.
      #
      # macOS only: CSC_LINK / CSC_KEY_PASSWORD are also read by the Windows
      # signer, so they are scoped to the mac job and unset elsewhere. Windows
      # signing prefers SignPath Foundation's free-for-OSS program (see
      # docs/DESKTOP.md §4): SIGNPATH_CONFIGURED (a boolean; see its own
      # comment below for why this step gets that instead of the real
      # SIGNPATH_API_TOKEN) plus three repo variables (organization id,
      # project slug, signing policy slug). SignPath signs asynchronously and
      # requires a human to approve every release, so this build step only
      # produces UNSIGNED Windows artifacts when SignPath is configured; the
      # actual signing happens in the steps below, after "Package Electron"
      # for this platform. A plain WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD .pfx
      # stays as a fallback for a traditional certificate when SignPath is
      # not configured, still signed inline here by electron-builder itself —
      # but, like SignPath, never PUBLISHED here; both wait for "Verify
      # Windows signing" to pass first (see that step and the `--publish`
      # branch below).
      #
      # electron-builder must stay at 26.16.1 or newer, and `^26.16.1` in
      # electron/package.json is load-bearing rather than tidy. Every release up
      # to and including 26.16.0 handed the .p12 export password to
      # `security set-key-partition-list -k`, which wants the temporary
      # keychain's own unlock password instead, and this job died on
      #   security: SecKeychainUnlock: The user name or passphrase you entered
      #   is not correct.
      # The wrong password is only ever checked when the keychain happens to be
      # locked at that moment, which is why the bug sat latent for years and
      # then fired on every run at once when the macos-26-arm64 image moved from
      # Darwin 25.5.0 to 25.6.0. Every green macOS build in that window ran
      # 25.5.0 and every red one ran 25.6.0, seven for seven. The secrets were
      # never stale.
      #
      # The trap for the next person: npm's `latest` tag for electron-builder is
      # still 26.15.3, which does NOT have the fix. 26.16.1 is published under
      # the `v26` tag, and a range that `latest` also satisfies resolves to
      # `latest`. Widening the caret to `^26` would quietly reinstall the bug.
      # Full write-up: docs/DESKTOP.md 3.8.
      - name: Package Electron
        working-directory: electron
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # SignPath (preferred Windows path, see docs/DESKTOP.md §4).
          # SIGNPATH_CONFIGURED is a BOOLEAN, evaluated by the Actions runner
          # from the secret's presence, not the secret itself: this step runs
          # electron-builder, repository-controlled build code that a
          # workflow_dispatch on any branch can point at modified hooks/config,
          # and the actual SIGNPATH_API_TOKEN must never be readable from
          # inside it (Farol review, PR 677) — only "Submit Windows build to
          # SignPath for signing" below needs the real token, and it takes it
          # straight from `secrets`, not from this step's environment.
          # Organization id, project slug and signing policy slug are not
          # sensitive and live as repo variables so they are visible next to
          # the workflow that uses them.
          SIGNPATH_CONFIGURED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          set -euo pipefail
          args=("--${PLATFORM}")

          if [ "$PLATFORM" = "mac" ]; then
            if [ -n "${CSC_LINK:-}" ]; then
              echo "::notice::Signing macOS build with CSC_LINK."
              echo "MAC_SIGNED=true" >> "$GITHUB_ENV"
              if [ -n "${APPLE_API_KEY_P8:-}" ] && [ -n "${APPLE_API_KEY_ID:-}" ] && [ -n "${APPLE_API_ISSUER:-}" ]; then
                # App Store Connect API key: preferred, does not expire when the
                # Apple ID password changes. @electron/notarize shells out to
                # `xcrun notarytool` with these, and so does
                # electron/scripts/notarize-dmg.js, which notarizes and staples
                # the .dmg itself — electron-builder only does the .app.
                #
                # No team id is passed here on purpose, and none is hardcoded:
                # notarytool resolves the team from the App Store Connect
                # issuer that owns the API key, and this account has exactly
                # one team (WXBFUF9WMA) so there is nothing to disambiguate.
                # A team id is only *required* on the APPLE_ID fallback below,
                # which is why APPLE_TEAM_ID is read there and only there.
                printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc-api-key.p8"
                export APPLE_API_KEY="$RUNNER_TEMP/asc-api-key.p8"
                args+=("-c.mac.notarize=true")
                echo "MAC_NOTARIZED=true" >> "$GITHUB_ENV"
                echo "::notice::Notarizing with an App Store Connect API key."
              elif [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
                # `mac.notarize` is a boolean in electron-builder 26. Up to
                # 25.1.8 it also accepted `{ teamId }`, and this line used to
                # pass `-c.mac.notarize.teamId=...`; that shape was removed in
                # 26.0.0 (PR #8582) and would now be an object where the schema
                # wants a boolean. The team id was never needed as config
                # anyway: @electron/notarize reads APPLE_TEAM_ID straight from
                # the environment, and it is already exported on this step.
                args+=("-c.mac.notarize=true")
                echo "MAC_NOTARIZED=true" >> "$GITHUB_ENV"
                echo "::notice::Notarizing with an Apple ID app-specific password."
              else
                echo "::warning::Signed but NOT notarized — Gatekeeper will still quarantine this build. Set APPLE_API_KEY_P8/APPLE_API_KEY_ID/APPLE_API_ISSUER, or APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID."
              fi
            else
              echo "::warning::No CSC_LINK — building macOS UNSIGNED. The .dmg will be quarantined by Gatekeeper and auto-update (Squirrel.Mac) will not work."
              export CSC_IDENTITY_AUTO_DISCOVERY=false
            fi
          else
            # Never let the macOS cert leak into a Windows/Linux signer.
            unset CSC_LINK CSC_KEY_PASSWORD
            if [ "$PLATFORM" = "win" ]; then
              if [ "${SIGNPATH_CONFIGURED:-false}" = "true" ] && [ -n "${SIGNPATH_ORGANIZATION_ID:-}" ] && \
                 [ -n "${SIGNPATH_PROJECT_SLUG:-}" ] && [ -n "${SIGNPATH_SIGNING_POLICY_SLUG:-}" ] && \
                 [ "$IS_TAG" = "true" ]; then
                # SignPath signs after this build, in the steps below (submit,
                # wait for a human's approval, download, patch the update
                # feed's hash, then publish), never here. electron-builder
                # must not sign or publish this run.
                echo "::notice::Building unsigned Windows artifacts for SignPath. Signing happens in a later step."
                echo "SIGNPATH_ENABLED=true" >> "$GITHUB_ENV"
                export CSC_IDENTITY_AUTO_DISCOVERY=false
              elif [ -n "${WIN_CSC_LINK:-}" ]; then
                echo "::notice::Signing Windows build with WIN_CSC_LINK."
                echo "WIN_SIGNED=true" >> "$GITHUB_ENV"
              else
                echo "::warning::No Windows signing configured (SignPath or WIN_CSC_LINK). Windows build is unsigned; SmartScreen will warn on download. See docs/DESKTOP.md §4."
                export CSC_IDENTITY_AUTO_DISCOVERY=false
              fi
            fi
          fi

          # Publish only from a version tag. Everything else is an artifact you
          # download from the run, so a push to main cannot rewrite the update
          # feed that installed apps are polling.
          #
          # Linux is the only platform that still publishes as part of THIS
          # command. macOS and Windows both publish in a later, dedicated step
          # instead, gated on that platform's own verification step passing:
          # electron-builder's `--publish always` here would upload before
          # "Verify macOS signing and notarization" / "Verify Windows signing"
          # ever run, so a bad signature (or a notarization-stripped .dmg, or
          # no signed .exe at all) could reach a user before anything checked
          # it. macOS publishes for real in "Publish macOS release assets",
          # gated on that verification step passing (an unsigned build still
          # counts as passing — see that step), and, until this review, the
          # Windows WIN_CSC_LINK fallback had no such gate at all: THAT path
          # used to publish right here, with verification only ever running
          # after the fact and only ever warning (Farol review, PR 677).
          # Windows now always defers to "Publish Windows release assets"
          # below, whichever of SignPath / WIN_CSC_LINK / unsigned produced
          # its files.
          if [ "$IS_TAG" = "true" ] && [ "$PLATFORM" = "linux" ]; then
            args+=("--publish" "always")
          else
            args+=("--publish" "never")
          fi

          echo "electron-builder ${args[*]}"
          pnpm exec electron-builder "${args[@]}"

      # SignPath signs the two top-level .exe files people actually download
      # and run (the NSIS installer, the portable build). It does not reach
      # inside the installer to sign the pqp.exe that ends up in Program
      # Files after install, because NSIS is a self-extracting exe, not one
      # of SignPath's composite formats (msi/appx/msix/zip) that it can
      # unpack, sign the contents of, and repackage. That is fine for what
      # this PR exists to fix: SmartScreen's "Windows protected your PC"
      # triggers on a freshly downloaded top-level file (Mark-of-the-Web),
      # which is exactly the installer and the portable exe, not a file
      # written during a local install. See docs/DESKTOP.md §4 "What
      # SignPath signs, and what it does not".
      - name: Upload unsigned Windows artifacts for SignPath
        id: upload-unsigned-win
        if: matrix.platform == 'win' && env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: electron/release/*.exe
          retention-days: 1

      # Blocks until a human approves the signing request (SignPath
      # Foundation's free OSS policy requires manual approval on every
      # release, docs/DESKTOP.md §4) or the timeout below is hit. The job
      # timeout above is set wide enough to give that real headroom.
      #
      # Pinned to a full commit SHA, not the mutable `v3` tag: this step runs
      # with `contents: write` and the SignPath API token, so a compromised
      # tag would be able to exfiltrate the token or tamper with release
      # assets via GITHUB_TOKEN (Farol review, PR 677). `# v3.0.0` names what
      # is pinned; bump only through a deliberate review of the new commit.
      - name: Submit Windows build to SignPath for signing
        id: signpath
        if: matrix.platform == 'win' && env.SIGNPATH_ENABLED == 'true'
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-win.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: "9000"
          output-artifact-directory: electron/release-signed

      # Copies the signed exe(s) over their unsigned originals in release/ so
      # every step after this one (verification, the update feed hash fix,
      # publishing, the final "Upload artifacts") works the same way
      # regardless of which Windows signing path ran. Also fixes latest.yml:
      # electron-builder wrote it against the unsigned bytes, and SignPath
      # changed those bytes, so left alone the update feed would carry a
      # hash that does not match what a user actually downloads and
      # electron-updater would reject every update silently. See
      # fix-update-feed-hash.js for the full story and its one known gap
      # (the .blockmap, which only costs a fallback to a full download).
      - name: Apply the signed Windows artifacts
        if: matrix.platform == 'win' && env.SIGNPATH_ENABLED == 'true'
        working-directory: electron
        shell: bash
        run: |
          set -euo pipefail
          cp release-signed/*.exe release/
          node scripts/fix-update-feed-hash.js release/latest.yml release-signed
          echo "WIN_SIGNED=true" >> "$GITHUB_ENV"

      # A green "Package Electron" is NOT evidence that the download works.
      # Run 31183972324 was green and shipped a .dmg that Gatekeeper rejects
      # with "source=no usable signature": electron-builder had notarized and
      # stapled the .app inside, and nothing at all to the disk image around
      # it. This step asks Gatekeeper about the file a user actually
      # double-clicks, and fails the job when the answer is wrong.
      - name: Verify macOS signing and notarization
        id: verify-mac
        if: matrix.platform == 'mac'
        working-directory: electron
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob

          if [ "${MAC_SIGNED:-false}" != "true" ]; then
            echo "::warning::Unsigned macOS build — skipping Gatekeeper verification."
            exit 0
          fi

          status=0
          check() { # check <label> <command...>
            local label="$1"; shift
            echo "--- $label"
            if "$@" 2>&1; then
              echo "    OK"
            else
              echo "::error::$label FAILED"
              status=1
            fi
          }

          # spctl exits 0 on "accepted" and non-zero on "rejected", so its exit
          # code is the assertion. -vvv is what prints the `source=` line that
          # distinguishes "Notarized Developer ID" from plain "Developer ID".
          for dmg in release/*.dmg; do
            echo "=== $dmg"
            check "spctl assess $dmg" spctl -a -vvv -t install "$dmg"
            check "spctl assess (primary-signature) $dmg" \
              spctl -a -vvv -t open --context context:primary-signature "$dmg"
            if [ "${MAC_NOTARIZED:-false}" = "true" ]; then
              check "stapler validate $dmg" xcrun stapler validate "$dmg"
            fi
          done

          for app in release/mac*/*.app; do
            echo "=== $app"
            check "codesign verify $app" \
              codesign --verify --deep --strict --verbose=2 "$app"
            check "spctl assess $app" spctl -a -vvv -t exec "$app"
            if [ "${MAC_NOTARIZED:-false}" = "true" ]; then
              check "stapler validate $app" xcrun stapler validate "$app"
            fi
          done

          # The .zip cannot carry a ticket — stapler has nowhere to write one
          # into a zip archive. Squirrel.Mac checks the downloaded bundle's
          # code signature against the running app's, not its notarization, and
          # electron-updater fetches over Node's HTTP stack so the staged file
          # never gets a com.apple.quarantine xattr. The .app inside the zip is
          # stapled anyway, which covers a human downloading it from a browser.
          # So there is nothing to assert about the zip beyond the app checks
          # above, which ran on the same bundle the zip was made from.

          exit $status

      # The other half of moving macOS's publish out of "Package Electron":
      # upload the artifacts it already built, but only now that Gatekeeper
      # has actually looked at them. `steps.verify-mac.outcome` reads the
      # verification step's own result, so a failed check still blocks this
      # even though the job itself would already be red by then too.
      # An unsigned build (fork, or secrets not set yet) still publishes here:
      # the verify step exits 0 for that case on purpose, same as it always
      # has, and that was never what this gate is for.
      #
      # electron-builder still writes `latest-mac.yml` and the `.blockmap`
      # files to `release/` even with `--publish never` above; only the
      # network upload was skipped, so nothing here needs a second build.
      # Windows and Linux create the tag's draft release themselves in one
      # step; this only creates it when macOS's job happens to finish first.
      - name: Publish macOS release assets
        if: |
          matrix.platform == 'mac' &&
          startsWith(github.ref, 'refs/tags/v') &&
          steps.verify-mac.outcome == 'success'
        working-directory: electron
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" --repo rafaelcg/pqp >/dev/null 2>&1 || \
            gh release create "$tag" --repo rafaelcg/pqp --draft --title "$tag"
          assets=(release/*.dmg release/*.zip release/*.blockmap release/*.yml)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::warning::No macOS release assets found in release/ to publish for $tag."
            exit 0
          fi
          gh release upload "$tag" "${assets[@]}" --repo rafaelcg/pqp --clobber

      # A REAL gate, the same shape as "Verify macOS signing and
      # notarization": "Publish Windows release assets" below only runs when
      # this step succeeds. Windows had no verification or publish gate at
      # all before this PR — the WIN_CSC_LINK fallback published straight out
      # of "Package Electron" with nothing checking the signature first
      # (Farol review, PR 677). An UNSIGNED build still exits 0 here on
      # purpose, same as macOS: that is a known, warned-about state, not a
      # broken one.
      - name: Verify Windows signing
        id: verify-win
        if: matrix.platform == 'win'
        working-directory: electron
        shell: pwsh
        run: |
          if ($env:WIN_SIGNED -ne "true") {
            Write-Host "::warning::Unsigned Windows build. Skipping Authenticode verification."
            exit 0
          }
          $failed = $false
          $exes = Get-ChildItem -Path release -Filter *.exe -Recurse -ErrorAction SilentlyContinue
          if (-not $exes) {
            Write-Host "::error::WIN_SIGNED is true but no .exe files were found under release/ to verify."
            exit 1
          }
          foreach ($exe in $exes) {
            $sig = Get-AuthenticodeSignature $exe.FullName
            Write-Host "=== $($exe.Name): $($sig.Status) $($sig.StatusMessage)"
            if ($sig.Status -ne "Valid") {
              Write-Host "::error::$($exe.Name) failed Authenticode verification: $($sig.Status) $($sig.StatusMessage)"
              $failed = $true
            }
          }
          if ($failed) {
            Write-Host "::error::One or more Windows artifacts did not verify. See docs/DESKTOP.md Windows signing section."
            exit 1
          }
          Write-Host "All Windows artifacts verified with a valid Authenticode signature."

      # The one Windows publish step, covering SignPath, WIN_CSC_LINK and the
      # unsigned fallback alike: "Package Electron" above never publishes
      # Windows assets itself, so whichever path produced release/'s files,
      # nothing reaches the release until "Verify Windows signing" (above)
      # has actually looked at them and passed.
      - name: Publish Windows release assets
        if: |
          matrix.platform == 'win' &&
          startsWith(github.ref, 'refs/tags/v') &&
          steps.verify-win.outcome == 'success'
        working-directory: electron
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" --repo rafaelcg/pqp >/dev/null 2>&1 || \
            gh release create "$tag" --repo rafaelcg/pqp --draft --title "$tag"
          assets=(release/*.exe release/*.blockmap release/*.yml)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::warning::No Windows release assets found in release/ to publish for $tag."
            exit 0
          fi
          gh release upload "$tag" "${assets[@]}" --repo rafaelcg/pqp --clobber

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pqp-electron-${{ matrix.platform }}
          path: |
            electron/release/*.*
            electron/release/*/*
          if-no-files-found: warn
          retention-days: 14
