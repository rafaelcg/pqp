name: Deploy API (Vultr)

# The Vultr counterpart to deploy-api-fly.yml. Both files exist on purpose:
# Fly stays deployable for ~30 days after the Vultr cutover, as the rollback
# target (docs/plans/WATCH_PARTY_POSTMORTEM_2026-09-12.md section E,
# docs/deploy-vultr.md "Rollback").
#
# ONLY ONE OF fly / vultr / railway MAY BE LIVE AT A TIME — same reasoning as
# deploy-api-fly.yml's header: two APIs on two databases behind two hostnames
# is two products, not a warm standby. The switch is deliberate and two-sided:
#
#   cut over to Vultr:  gh variable set DEPLOY_TARGET --body vultr
#                        gh workflow disable "Deploy API (Fly)"
#   roll back to Fly:    gh workflow enable "Deploy API (Fly)"
#                        gh variable set DEPLOY_TARGET --body fly
#
# The `vars.DEPLOY_TARGET` gate below means merging this file changes nothing
# until someone flips it — this can land, and the box can be provisioned and
# even smoke-tested by hand, well before the flip.
#
# `vars.DEPLOY_FREEZE` is checked too, forward-compatible with the merge
# freeze A6 in the postmortem plan describes (docs/plans/
# WATCH_PARTY_POSTMORTEM_2026-09-12.md section A) if and when it lands on
# deploy-api-fly.yml — today the variable does not exist anywhere in this
# repo, so the check is a no-op (an unset repo variable is never the string
# "true"). Nothing here invents the freeze mechanism; it only agrees to
# respect it once something else does.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  # Shared with deploy-api.yml and deploy-api-fly.yml on purpose: during any
  # transition at most one backend-pointing deploy runs at a time, never a
  # race to decide which one production actually ends up running.
  group: deploy-api
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/rafaelcg/pqp-api
  HEALTH_URL: https://api.pqp.gg/health
  READY_URL: https://api.pqp.gg/ready

jobs:
  deploy:
    name: Build & deploy Vultr (gru)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A manual dispatch is only trusted when it runs FROM main — never an
    # arbitrary branch, which would otherwise let anyone who can run
    # workflows (not necessarily anyone who can merge to main) build and
    # deploy unreviewed code (a modified Dockerfile or compose/Caddy file)
    # straight to production.
    #
    # The workflow_run half needs its OWN check beyond head_branch == main:
    # `head_branch` is just a string a fork controls (a fork can have its
    # own branch literally named "main"), so without pinning
    # head_repository too, a CI run completing on a fork's "main" would
    # satisfy this condition and hand it that fork's head_sha, Dockerfile
    # and compose/Caddy files to build and deploy with production secrets.
    if: ${{ ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)) && vars.DEPLOY_TARGET == 'vultr' && vars.DEPLOY_FREEZE != 'true' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          # Full history: the relevance check diffs against whatever commit
          # production is actually running, same reason deploy-api-fly.yml
          # gives for the same line.
          fetch-depth: 0

      - name: Resolve commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Same question, same answer, as deploy-api-fly.yml's "Does the API
      # need this commit?" step, and deliberately the SAME script
      # (scripts/deploy/api-deploy-needed.mjs) for the code-relevance half —
      # one definition of "does the server image need to change" shared by
      # both backends, so it cannot drift between them. This workflow adds
      # its OWN box-relevance check on top (this file and tools/api-host/**),
      # rather than teaching the shared script about a path that has nothing
      # to do with the Fly deploy: editing deploy-api-vultr.yml or the
      # compose/Caddy config on this box must redeploy here without ever
      # causing an extra Fly restart, and the reverse.
      - name: Does the API need this commit?
        id: relevant
        run: |
          set -uo pipefail
          decide() {
            echo "needed=$1" >> "$GITHUB_OUTPUT"
            echo "::notice::Vultr deploy needed=$1 ($2)"
          }

          body=$(curl -fsS --max-time 15 "$HEALTH_URL" 2>/dev/null) || {
            decide true "could not reach $HEALTH_URL, failing open"; exit 0; }
          deployed=$(printf '%s' "$body" | jq -r '.version // empty' 2>/dev/null) || deployed=""

          case "$deployed" in
            ?*[!0-9a-f]* | "" ) decide true "no usable commit in /health (got '${deployed:-empty}'), failing open"; exit 0 ;;
          esac
          if ! git cat-file -e "${deployed}^{commit}" 2>/dev/null; then
            decide true "deployed commit $deployed is not in this clone, failing open"; exit 0
          fi

          changed=$(git diff --name-only "$deployed" HEAD) || {
            decide true "git diff failed, failing open"; exit 0; }
          if [ -z "$changed" ]; then
            decide false "production is already on this tree"; exit 0
          fi

          if printf '%s\n' "$changed" | grep -qE '^(\.github/workflows/deploy-api-vultr\.yml|tools/api-host/)'; then
            decide true "this workflow or tools/api-host/ changed"
            exit 0
          fi

          set +e
          reason=$(printf '%s\n' "$changed" | node scripts/deploy/api-deploy-needed.mjs)
          status=$?
          set -e
          case "$status" in
            0)  decide true "$reason (since ${deployed:0:7})" ;;
            20)
              decide false "$reason (since ${deployed:0:7})"
              printf '%s\n' "$changed" | sed 's/^/  skipped: /'
              ;;
            *)  decide true "relevance script exited $status, failing open" ;;
          esac

      - name: Check deploy environment
        if: steps.relevant.outputs.needed == 'true'
        run: |
          missing=""
          [ -n "${{ secrets.VULTR_API_HOST }}" ] || missing="$missing VULTR_API_HOST"
          [ -n "${{ secrets.VULTR_API_SSH_KEY }}" ] || missing="$missing VULTR_API_SSH_KEY"
          [ -n "${{ secrets.VULTR_CONFIG_HMAC_KEY }}" ] || missing="$missing VULTR_CONFIG_HMAC_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing. See docs/deploy-vultr.md."
            exit 1
          fi

      - name: Set up Docker Buildx
        if: steps.relevant.outputs.needed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.relevant.outputs.needed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same Dockerfile deploy-api-fly.yml builds via `flyctl deploy`
      # (root Dockerfile, the multi-stage image documented there and in
      # docs/deploy-fly.md): building it once here and pushing to GHCR means
      # both backends could in principle run the identical artifact, though
      # only one is ever live per vars.DEPLOY_TARGET.
      - name: Build & push image
        if: steps.relevant.outputs.needed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.commit.outputs.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write deploy SSH key
        if: steps.relevant.outputs.needed == 'true'
        run: |
          install -m 0600 /dev/null "$RUNNER_TEMP/vultr_deploy_key"
          printf '%s\n' "${{ secrets.VULTR_API_SSH_KEY }}" > "$RUNNER_TEMP/vultr_deploy_key"

      # This key authenticates to `pqp-deploy`, not `pqp` — see
      # tools/api-host/cloud-init.yaml and provision.sh. That account has
      # no docker group and no broad sudo; the ONLY thing it can do is
      # invoke the one fixed, root-owned script below via a sudoers rule
      # scoped to that exact path, which is why a leaked
      # VULTR_API_SSH_KEY cannot start an arbitrary container or read
      # /opt/pqp/.env directly. It also cannot write into /opt/pqp, so the
      # new compose.yaml/Caddyfile land in its own home first; pqp-deploy
      # (the script) installs them into /opt/pqp as root before using them.
      - name: Read previously deployed tag
        id: prevtag
        if: steps.relevant.outputs.needed == 'true'
        env:
          SSH_KEY: ${{ runner.temp }}/vultr_deploy_key
          HOST: ${{ secrets.VULTR_API_HOST }}
        run: |
          ssh_cmd() {
            ssh -i "$SSH_KEY" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 "pqp-deploy@$HOST" "$@"
          }
          tag=$(ssh_cmd 'cat /opt/pqp/.deployed-tag 2>/dev/null' || true)
          echo "tag=${tag:-}" >> "$GITHUB_OUTPUT"
          echo "Previously deployed tag: ${tag:-none (first deploy on this box)}"

      # pqp-deploy (the account VULTR_API_SSH_KEY authenticates to) can
      # stage whatever bytes it likes in its own home directory -- that is
      # the account a leaked key gives an attacker. Root only installs a
      # staged compose.yaml/Caddyfile if it comes with a manifest signed by
      # VULTR_CONFIG_HMAC_KEY, a SECOND secret pqp-deploy itself never has
      # (see tools/api-host/pqp-deploy.sh). Signing happens here, on the
      # runner, over the files from THIS verified checkout, before either
      # file goes anywhere near the SSH connection an attacker might also
      # hold.
      - name: Sign compose/Caddy config
        if: steps.relevant.outputs.needed == 'true'
        env:
          HMAC_KEY: ${{ secrets.VULTR_CONFIG_HMAC_KEY }}
        run: |
          (cd tools/api-host && sha256sum compose.yaml Caddyfile) > "$RUNNER_TEMP/manifest.sha256"
          openssl dgst -sha256 -hmac "$HMAC_KEY" -r "$RUNNER_TEMP/manifest.sha256" \
            | awk '{print $1}' > "$RUNNER_TEMP/manifest.sig"

      # Copies the two files whose content actually matters at deploy time
      # (compose.yaml, Caddyfile), plus the manifest and signature above,
      # into pqp-deploy's own staging directory, then runs the one script
      # that account may sudo. That script (root) verifies the signature,
      # installs the files into /opt/pqp only if it checks out, pulls BOTH
      # images before touching either running container (so a bad tag
      # never leaves api and worker on different releases), brings up api
      # + worker, and reloads Caddy from whatever Caddyfile is now in
      # place — a Caddy-only change no longer sits copied-but-inert. It
      # waits for both containers' own Docker healthchecks and confirms
      # the API is actually serving this commit before exiting 0; any of
      # that failing is a non-zero exit, which this step surfaces via
      # `continue-on-error` so the rollback step below still gets to run.
      #
      # stop_grace_period: 60s in compose.yaml is what gives
      # server/src/lib/drain.ts's SIGTERM handling room to finish (25s
      # budget) before Compose sends SIGKILL, same contract as fly.toml's
      # kill_timeout.
      - name: Deploy over SSH
        id: deploy
        if: steps.relevant.outputs.needed == 'true'
        continue-on-error: true
        env:
          SSH_KEY: ${{ runner.temp }}/vultr_deploy_key
          HOST: ${{ secrets.VULTR_API_HOST }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          ssh_cmd() {
            ssh -i "$SSH_KEY" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 "pqp-deploy@$HOST" "$@"
          }
          scp -i "$SSH_KEY" -o StrictHostKeyChecking=accept-new \
            tools/api-host/compose.yaml tools/api-host/Caddyfile \
            "$RUNNER_TEMP/manifest.sha256" "$RUNNER_TEMP/manifest.sig" \
            "pqp-deploy@$HOST:/home/pqp-deploy/incoming/"
          ssh_cmd "sudo /usr/local/bin/pqp-deploy $SHA"

      # Mirrors deploy-api-fly.yml's "Verify the deployed commit" step in
      # intent, but NOT in mechanism: that step curls the box straight from
      # the runner, and here that is not possible. tools/api-host/
      # provision.sh (and cloud-init.yaml) leave ufw denying 80/443 to
      # everyone except Cloudflare's own published ranges, because
      # api.pqp.gg is proxied (orange-cloud) and the origin should only
      # ever hear from Cloudflare's edge. A GitHub-hosted runner is not in
      # those ranges, so a direct `curl --connect-to api.pqp.gg:443:$HOST:443`
      # from here has its TCP connection dropped by ufw and the whole loop
      # times out after 40 attempts — every Vultr deploy would fail and
      # roll back even when the box came up perfectly healthy.
      #
      # So the check runs ON the box instead, over the same SSH identity
      # the deploy step above already used (pqp-deploy@$HOST). From
      # loopback, ufw is irrelevant: `--connect-to` still forces the TCP
      # connection at 127.0.0.1 while keeping the real TLS handshake (SNI,
      # cert, Host header) for api.pqp.gg, so this proves Caddy is actually
      # serving the site, not just that something answers on port 3001.
      # `-k` is required, not optional: tools/api-host/Caddyfile's default
      # (Mode A) terminates TLS with a Cloudflare Origin CA certificate,
      # which only Cloudflare's own client trusts — curl on the box would
      # otherwise fail the handshake against its own reverse proxy.
      #
      # The box only ever runs curl and returns the raw body/status; the
      # version comparison itself happens back on the runner via jq, kept
      # off the box on purpose (pqp-deploy has no need for another
      # dependency, and jq's absence there was never the point of this fix).
      # Both curls keep `-f`, same as before: without it, a 4xx/5xx
      # response whose JSON body still happens to carry the right version
      # string would read as a healthy deploy instead of failing the
      # attempt.
      #
      # This proves Caddy → api on the box itself, not that Cloudflare's
      # edge can still reach it (a wrong DNS record, a stale ufw allowlist,
      # or a misrouted proxy would all pass this check and still be a real
      # outage). That gap is intentional, not missed: the box has no
      # Cloudflare-range vantage point to check FROM, and the outside-in
      # half is exactly what `.github/workflows/monitor-uptime.yml` and the
      # UptimeRobot checks in docs/MONITORING.md already watch, continuously,
      # independent of any one deploy.
      #
      # TWO REPLICAS (docs/plans/ALWAYS_ON.md A0.2): checking only the
      # public path via Caddy is not enough on its own any more — Caddy
      # round-robins api-a/api-b, so one lucky hit proves at most one of
      # them is on the new tag, and pqp-deploy.sh's own per-container
      # verify already runs as root inside the box (it has docker access;
      # this SSH identity deliberately does not — see pqp-deploy.sh's
      # header). So this step also curls api-a and api-b DIRECTLY, each on
      # its own loopback-only port (compose.yaml's `127.0.0.1:3011`/`:3012`
      # publishes, added for exactly this), which needs no docker socket
      # access at all. api-b's port intentionally refuses connections when
      # this box is running with `API_REPLICAS=1` (compose.yaml's
      # `replicas` profile is inactive, so the container never starts) —
      # that is a valid, expected state, not a failure. The distinction
      # that matters is curl's OWN exit code, not just "did we get a
      # body": exit 7 is "couldn't connect at all" (nothing listening on
      # :3012, i.e. api-b genuinely isn't running), which is the only
      # case this step treats as acceptably absent. Any other failure —
      # a timeout, a non-2xx from `-f`, a reset mid-response — means
      # something IS listening on :3012 but unhealthy, and that must
      # still fail the check; api-b existing in a broken state is not the
      # same thing as api-b not existing, and conflating the two would
      # let a genuinely degraded two-replica deploy pass as clean.
      - name: Verify the deployed commit
        id: verify
        if: steps.relevant.outputs.needed == 'true' && steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          SSH_KEY: ${{ runner.temp }}/vultr_deploy_key
          EXPECTED: ${{ steps.commit.outputs.sha }}
          HOST: ${{ secrets.VULTR_API_HOST }}
        run: |
          ssh_cmd() {
            ssh -i "$SSH_KEY" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 "pqp-deploy@$HOST" "$@"
          }
          # One SSH session per attempt (not four), and all four curls
          # launched CONCURRENTLY inside it (not chained) — with four
          # sequential 10s-max-time curls, a single hung endpoint could
          # cost ~40s per attempt before the 15s sleep, and 40 attempts of
          # that risks running past this job's own 30-minute timeout
          # before ever reaching the rollback step. Running them in
          # parallel bounds one attempt to roughly the slowest single
          # curl (≤10s) plus the sleep, not the sum of all four.
          # api-b's curl has no `-f`, so a connection-refused comes back
          # as an empty body with a distinguishable exit code (captured
          # separately below) rather than aborting the remote script.
          remote_check=$(cat <<REMOTE
          ta=\$(mktemp); tb=\$(mktemp); tc=\$(mktemp); tr=\$(mktemp)
          curl -fsS --max-time 10 'http://127.0.0.1:3011/health' >"\$ta" 2>/dev/null & pa=\$!
          curl -sS --max-time 10 'http://127.0.0.1:3012/health' >"\$tb" 2>/dev/null & pb=\$!
          curl -fsS -k --max-time 10 --connect-to 'api.pqp.gg:443:127.0.0.1:443' '$HEALTH_URL' >"\$tc" 2>/dev/null & pc=\$!
          curl -fsS -k -o /dev/null -w '%{http_code}' --max-time 10 --connect-to 'api.pqp.gg:443:127.0.0.1:443' '$READY_URL' >"\$tr" 2>/dev/null & pr=\$!
          wait \$pa; ra=\$?
          wait \$pb; rb=\$?
          wait \$pc; rc=\$?
          wait \$pr || true
          ready=\$(cat "\$tr" 2>/dev/null)
          [ -n "\$ready" ] || ready='000'
          body_a=\$(cat "\$ta" 2>/dev/null); [ \$ra -eq 0 ] || body_a='{}'
          body_b=\$(cat "\$tb" 2>/dev/null)
          body_caddy=\$(cat "\$tc" 2>/dev/null); [ \$rc -eq 0 ] || body_caddy='{}'
          rm -f "\$ta" "\$tb" "\$tc" "\$tr"
          printf '%s\t%s\t%s\t%s\t%s\n' "\$body_a" "\$rb" "\$body_b" "\$body_caddy" "\$ready"
          REMOTE
          )
          for attempt in $(seq 1 40); do
            line=$(ssh_cmd "$remote_check" || printf '{}\t1\t\t{}\t000')
            body_a=$(printf '%s' "$line" | cut -f1)
            rc_b=$(printf '%s' "$line" | cut -f2)
            body_b=$(printf '%s' "$line" | cut -f3)
            body_caddy=$(printf '%s' "$line" | cut -f4)
            ready=$(printf '%s' "$line" | cut -f5)

            got_a=$(printf '%s' "$body_a" | jq -r '.version // empty' 2>/dev/null || echo "")
            got_caddy=$(printf '%s' "$body_caddy" | jq -r '.version // empty' 2>/dev/null || echo "")

            case "$rc_b" in
              0)
                got_b=$(printf '%s' "$body_b" | jq -r '.version // empty' 2>/dev/null || echo "")
                b_status="${got_b:-unknown}"
                [ "$got_b" = "$EXPECTED" ] && b_ok=true || b_ok=false
                ;;
              7)
                # Connection refused: nothing listening on :3012 at all —
                # the expected, non-failure shape of API_REPLICAS=1.
                b_status="not running"
                b_ok=true
                ;;
              *)
                # Reachable-but-broken (timeout, reset, non-2xx, ...): a
                # real api-b exists and is unhealthy. Must fail, not be
                # waved through as "absent".
                b_status="unhealthy (curl exit $rc_b)"
                b_ok=false
                ;;
            esac

            if [ "$got_a" = "$EXPECTED" ] && [ "$b_ok" = "true" ] && [ "$got_caddy" = "$EXPECTED" ] && [ "$ready" = "200" ]; then
              echo "$HOST: api-a=$got_a api-b=$b_status caddy=$got_caddy ready=$ready"
              exit 0
            fi
            echo "attempt $attempt: api-a='${got_a:-unknown}' api-b='$b_status' caddy='${got_caddy:-unknown}' (want '$EXPECTED'), ready=$ready"
            sleep 15
          done
          echo "::error::$HOST never reported the deployed commit as healthy and ready on every replica actually running."
          exit 1

      # Both the deploy script's own internal health wait and the
      # on-box verification above have to pass, or production
      # goes back to whatever it was serving before this run touched it —
      # a half-updated api/worker pair, or a Caddyfile that failed to
      # reload, is worse than staying on the last known-good tag.
      - name: Roll back to the previous tag on failure
        if: steps.relevant.outputs.needed == 'true' && (steps.deploy.outcome == 'failure' || steps.verify.outcome == 'failure') && steps.prevtag.outputs.tag != '' && steps.prevtag.outputs.tag != 'none'
        env:
          SSH_KEY: ${{ runner.temp }}/vultr_deploy_key
          HOST: ${{ secrets.VULTR_API_HOST }}
          PREV: ${{ steps.prevtag.outputs.tag }}
        run: |
          echo "::warning::Deploy of ${{ steps.commit.outputs.sha }} failed; rolling back to $PREV"
          ssh -i "$SSH_KEY" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "pqp-deploy@$HOST" "sudo /usr/local/bin/pqp-deploy $PREV" \
            || echo "::error::Rollback to $PREV itself failed. SSH in as pqp (docs/deploy-vultr.md) and check 'docker compose logs api-a api-b worker caddy' immediately."

      - name: Fail the job if the new tag never became healthy
        if: steps.relevant.outputs.needed == 'true' && (steps.deploy.outcome == 'failure' || steps.verify.outcome == 'failure')
        env:
          HOST: ${{ secrets.VULTR_API_HOST }}
        run: |
          echo "::error::Vultr deploy of ${{ steps.commit.outputs.sha }} did not become healthy. Check 'ssh pqp@$HOST docker compose logs api-a api-b worker caddy' (see docs/deploy-vultr.md)."
          exit 1
