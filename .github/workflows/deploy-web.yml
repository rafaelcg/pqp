name: Deploy Web

# Only deploy after CI succeeds on main (workflow_run), so a commit that fails
# typecheck/build/test never reaches production. Manual dispatch stays available.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Gate the branch here rather than in the workflow_run filter: only a
    # successful CI run on main deploys. Manual dispatch always runs.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Version comes from the root package.json "packageManager" field.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @pqp/shared build

      # A Pages build with empty API URLs points /app at the static host, which
      # has no API — the app loads and then fails on every request. Fail loudly
      # here instead of shipping that.
      - name: Check client environment
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
        run: |
          missing=0
          for name in VITE_CLERK_PUBLISHABLE_KEY VITE_API_URL VITE_WS_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret $name. Set it with: gh secret set $name"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Build client (production)
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
          VITE_DEV_AUTH_BYPASS: "false"
          # Not a secret: the Umami website id is visible in the page source of
          # every site running it. It lives here rather than in repository
          # secrets so it is greppable, and so a fork that has not set it up
          # simply builds without the tag (see the `umami` plugin in
          # client/vite.config.ts).
          VITE_UMAMI_WEBSITE_ID: "7ac342b9-238a-43ae-a7e2-13b338a52990"
          # Optional — public TestFlight join link. Empty is fine; the client
          # then uses the default in client/src/lib/testflight.ts.
          VITE_TESTFLIGHT_URL: ${{ secrets.VITE_TESTFLIGHT_URL }}
          # Optional — Android beta APK. Empty uses GitHub
          # releases/download/android-beta/pqp.apk (not /releases/latest;
          # that tag is Electron). A single space hides the button.
          # Not a secret; a repository variable is enough.
          VITE_ANDROID_APK_URL: ${{ vars.VITE_ANDROID_APK_URL }}
          # Hosted-only click counter for the /android APK button. Empty on a
          # fork means the build never beacons. Not a secret: the path is
          # public and writes a number, nothing else.
          VITE_ANDROID_APK_CLICK_URL: "https://pqp-admin.rafaelcg-a0a.workers.dev/apk-click"
          # Google Ads conversion tracking. Both empty until the conversion
          # action exists in the Ads account, and empty means the build emits no
          # Google tag whatsoever, so setting them is what turns this on. They
          # go through repository variables rather than secrets because neither
          # is one: both are readable in the page source of any site that runs
          # conversion tracking. See client/src/lib/google-ads-tag.ts.
          VITE_GOOGLE_ADS_ID: ${{ vars.VITE_GOOGLE_ADS_ID }}
          VITE_GOOGLE_ADS_SIGNUP_LABEL: ${{ vars.VITE_GOOGLE_ADS_SIGNUP_LABEL }}
        run: pnpm --filter @pqp/client build

      # Install wrangler outside the pnpm workspace (npm + workspace:* fails in client/)
      #
      # RUN IT FROM `client/`, not from the temp directory. `wrangler pages
      # deploy` picks up a `functions/` directory relative to the CURRENT WORKING
      # DIRECTORY, and `client/functions/_middleware.ts` is what puts real Open
      # Graph tags on `/@handle` — deploying from anywhere else silently ships
      # the site with no middleware at all, which looks exactly like a working
      # deploy until somebody pastes a profile link into WhatsApp. The binary is
      # invoked by absolute path so the install can stay outside the workspace.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing secret CLOUDFLARE_API_TOKEN. Create a Pages Edit token and run: gh secret set CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          TMP="$(mktemp -d)"
          (cd "$TMP" && npm init -y >/dev/null && npm install wrangler@4 --no-fund --no-audit)
          cd "$GITHUB_WORKSPACE/client"
          "$TMP/node_modules/.bin/wrangler" pages deploy dist \
            --project-name=pqp --commit-dirty=true

      # The middleware is only useful if it is actually in the bundle. A grep is
      # a poor test and a fine tripwire: it fails the deploy on the one mistake
      # that has no other symptom.
      - name: Verify the profile middleware shipped
        run: |
          test -f "$GITHUB_WORKSPACE/client/functions/_middleware.ts" \
            || { echo "::error::client/functions/_middleware.ts is missing — /@handle will not unfurl"; exit 1; }
          test -f "$GITHUB_WORKSPACE/client/dist/edge-config.json" \
            || { echo "::error::dist/edge-config.json was not emitted — the middleware cannot find the API"; exit 1; }
          grep -q '"apiUrl":"http' "$GITHUB_WORKSPACE/client/dist/edge-config.json" \
            || { echo "::error::edge-config.json has no apiUrl — VITE_API_URL was empty at build time"; exit 1; }
