name: Set up workspace
description: >-
  pnpm, Node 22 with the pnpm store cache, `pnpm install --frozen-lockfile`
  and the @pqp/shared build. Every CI job starts with this after checkout, so
  the jobs split out of the old single `checks` job do not each carry their own
  copy of the same four steps.
runs:
  using: composite
  steps:
    - name: Setup pnpm
      # Version comes from the root package.json "packageManager" field.
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Build shared
      shell: bash
      run: pnpm --filter @pqp/shared build
