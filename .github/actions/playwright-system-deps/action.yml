name: Playwright system deps
description: >-
  `playwright install-deps` for the given browsers, made to survive a slow
  Ubuntu mirror. On 2026-11-18 the mirror served this job's packages at 59 to
  106 kB/s (22 MB of fonts for Chromium, 32 MB of ffmpeg libraries for
  Firefox), so the step took 4 to 8 minutes and twice ran into its timeout,
  which failed main CI and skipped the production deploys that wait on it.
  Three things here: the downloaded .deb files are cached (a warm run
  downloads nothing), a download that crawls is killed and restarted (apt
  resumes the partial file and keeps every finished one), and whatever was
  downloaded is saved even when the step fails, so the next run starts ahead.
  Needs `pnpm install` to have run (the Playwright CLI is a client dependency).
inputs:
  browsers:
    description: Space separated Playwright browsers, e.g. "chromium firefox".
    required: true
  attempts:
    description: How many times to try.
    required: false
    default: "3"
  attempt-seconds:
    description: How long one try may run before it is killed and restarted.
    required: false
    default: "200"
runs:
  using: composite
  steps:
    - name: Pick the apt archive directory
      id: dir
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        set -euo pipefail
        echo "path=$HOME/.cache/pqp-apt-archives" >> "$GITHUB_OUTPUT"
        flavor="${BROWSERS// /+}"
        echo "prefix=apt-playwright-$RUNNER_OS-$flavor-" >> "$GITHUB_OUTPUT"

    - name: Restore apt archive
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.dir.outputs.path }}
        key: ${{ steps.dir.outputs.prefix }}${{ hashFiles('pnpm-lock.yaml') }}-none
        restore-keys: |
          ${{ steps.dir.outputs.prefix }}

    - name: Bound apt stalls and use the cached archive
      uses: ./.github/actions/bound-apt
      with:
        archives-dir: ${{ steps.dir.outputs.path }}

    - name: Fingerprint the archive before
      id: before
      shell: bash
      env:
        ARCHIVE: ${{ steps.dir.outputs.path }}
      run: echo "sum=$(ls "$ARCHIVE" | grep '\.deb$' | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    - name: Install Playwright system deps
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
        ATTEMPTS: ${{ inputs.attempts }}
        ATTEMPT_SECONDS: ${{ inputs.attempt-seconds }}
      run: |
        set -uo pipefail
        # Resolve the CLI as the runner user (pnpm may not be on root's PATH),
        # then run it as root under `timeout`: a timeout started by the runner
        # user cannot signal the root apt-get that actually holds the download.
        # pnpm runs it from client/ and the PATH entry is relative, so make it absolute.
        pw="$(pnpm --filter @pqp/client exec sh -c 'cd "$(dirname "$(command -v playwright)")" && printf "%s/playwright" "$PWD"' | tail -n1)"
        echo "playwright cli: $pw"
        if [ ! -x "$pw" ]; then
          echo "::error::could not resolve the playwright CLI (got '$pw')"
          exit 1
        fi
        for attempt in $(seq 1 "$ATTEMPTS"); do
          echo "::group::install-deps $BROWSERS, attempt $attempt of $ATTEMPTS"
          # A try killed while dpkg was unpacking would leave it half done.
          sudo dpkg --configure -a || true
          # shellcheck disable=SC2086
          if sudo timeout --kill-after=15 "$ATTEMPT_SECONDS" env "PATH=$PATH" "$pw" install-deps $BROWSERS; then
            echo "::endgroup::"
            exit 0
          fi
          echo "::endgroup::"
          echo "::warning::install-deps $BROWSERS attempt $attempt did not finish in ${ATTEMPT_SECONDS}s or failed; the .deb files already downloaded are kept"
        done
        echo "::error::install-deps $BROWSERS failed after $ATTEMPTS attempts"
        exit 1

    - name: Fingerprint the archive after
      id: after
      if: always()
      shell: bash
      env:
        ARCHIVE: ${{ steps.dir.outputs.path }}
      run: echo "sum=$(ls "$ARCHIVE" | grep '\.deb$' | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    # Saved only when this run downloaded something new, under a key of its
    # own: an exact key is immutable once written, so a partial archive saved
    # by a failed run under a fixed key would stay partial forever. Once the
    # archive is complete nothing new is downloaded and nothing more is saved.
    - name: Save apt archive
      if: always() && steps.after.outputs.sum != steps.before.outputs.sum
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.dir.outputs.path }}
        key: ${{ steps.dir.outputs.prefix }}${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
