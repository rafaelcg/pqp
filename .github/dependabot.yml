# Dependabot VERSION updates. Security updates are a separate repository
# setting (Settings, Code security: Dependabot alerts and Dependabot security
# updates), not something this file turns on; with them enabled, a security
# update ignores `cooldown` and the groups below and opens on its own.
#
# Every entry waits 3 days after a release before proposing it (`cooldown`),
# the same window as `minimumReleaseAge` in pnpm-workspace.yaml, so a
# compromised release that is yanked within days is never proposed. Minor and
# patch bumps are grouped into one PR per ecosystem per week; a major bump
# stays its own PR so it gets read (in the workspace, one PR per dependency
# across all its directories, see `group-by` below).
version: 2

updates:
  # The pnpm workspace (root pnpm-lock.yaml). Dependabot reads pnpm from the
  # `npm` ecosystem and needs each workspace package listed.
  - package-ecosystem: npm
    directories:
      - "/server"
      - "/client"
      - "/electron"
      - "/packages/shared"
      - "/packages/app-sdk"
      - "/tools/watch-party-load"
      - "/tools/apps-build"
      - "/docs-apps"
      - "/apps/eco"
      - "/apps/locadora"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    ignore:
      # Moves only together with @livekit/rtc-node, never alone. The load
      # harness (tools/watch-party-load) pins rtc-node 1.2.2, whose own
      # dependency is the exact 0.13.2, and passes this package's enums to
      # it. A bump of this one copy puts two protobuf generations side by
      # side and CI only typechecks the harness, it never joins a room. It
      # came back in the weekly group twice (#1526, #1626), and the rtc-node
      # 1.x bump (#1655) did the same from the other side: it moved rtc-node
      # and left this copy on 0.12.73. Both were taken by hand in one PR.
      # Keep this ignore: when a rtc-node bump changes its exact pin (see
      # `npm view @livekit/rtc-node@<version> dependencies`), move both
      # versions in tools/watch-party-load/package.json together.
      - dependency-name: "@livekit/rtc-ffi-bindings"
      # 1.65.x fails two e2e lanes on Chrome 158: the sandboxed Locadora frame
      # logs "Permissions policy violation: focus-without-user-activation",
      # which apps/locadora/e2e/locadora.spec.mts asserts never happens, and the
      # app-frame file-picker spec reads "cancelled". It turned #1626 and #1637
      # red. Only this minor is skipped; 1.66 and later still flow. Remove this
      # once the Locadora frame or that spec is fixed and 1.65 can be taken by hand.
      - dependency-name: "@playwright/test"
        versions: ["1.65.x"]
      # The types follow the Node the code RUNS on, not the newest release. The
      # API image and every CI job run Node 24 and the packages are on 22, so
      # 25 and later describe APIs the runtime does not have. Moving to 24 is a
      # by-hand change with the runtime; 23 to 24 still flow.
      - dependency-name: "@types/node"
        versions: [">=25.0.0"]
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
      # Everything else that is left (majors). Without this each directory got
      # its own PR for the same bump, and those PRs changed one package.json and
      # not pnpm-lock.yaml, so CI died at `pnpm install --frozen-lockfile`
      # (vitest 5 in eight directories, @types/node in six: 1687 to 1702). With
      # `group-by` it is one PR per dependency that moves it everywhere with the
      # lockfile. Order matters: a dependency lands in the first group that
      # matches, so minor and patch stay in the weekly group above.
      npm-major-by-dependency:
        group-by: dependency-name

  # The workspace root, on its own because of one ignore that must not reach
  # the packages. The root `typescript` exists for typescript-eslint, which
  # declares `typescript >=4.8.4 <6.1.0` and needs the compiler's JS API; TypeScript
  # 7 is a native binary whose `typescript` module has no such API. Every
  # package type-checks and builds with 7 (their own `typescript`), so only the
  # root is held on 6.x. Revisit when typescript-eslint ships a release whose
  # peer range admits `@typescript/native` / 7.1 (its typescript-estree 8.73
  # already lists that peer), then remove the ignore and move the root to 7.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # Three tools with their own package-lock.json, outside the workspace.
  # (tools/ambient has no lockfile, so a bump there would only move a range.)
  - package-ecosystem: npm
    directories:
      - "/tools/admin-dashboard"
      - "/tools/hls-edge"
      - "/tools/support-bot"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      tools-npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Base images in the Dockerfiles. Deliberately no compose files: the SFU and
  # API box images (LiveKit, egress, Caddy) are bumped by hand in a quiet hour,
  # because recreating the SFU drops live calls.
  - package-ecosystem: docker
    directories:
      - "/"
      - "/tools/support-bot"
      - "/tools/ambient"
      - "/tools/ll-loss-harness/publisher"
      - "/tools/ll-loss-harness/remuxd"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    ignore:
      # The runtime major is a decision (Node 24 is what CI and the API image
      # run; the support-bot and ambient images are still on 22 until somebody
      # moves them by hand), not a weekly chore. Minor and patch of the same
      # major still flow.
      - dependency-name: "node"
        update-types:
          - version-update:semver-major
    groups:
      docker:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: "/android"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      android:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
